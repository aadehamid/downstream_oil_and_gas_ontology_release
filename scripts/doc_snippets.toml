# The registry of scripts/doc_snippets.py: the reasons a code block may be skipped for, and the contexts a block
# may run in. scripts/DOC-SNIPPETS.md explains both for writers.

# The check with --strict fails on these reasons. The cut runs --strict, so none may remain in the release.
temporary_reasons = ["awaits-the-rewrite"]

# A skipped block is written `skip reason="<reason>: <detail>"`. Only these reasons are allowed. Each says why a
# test on this machine cannot run the block. scripts/test_doc_snippets.py pins this list, so a new reason is a
# deliberate change there too.
[reasons]
needs-client-server = "The command reads or writes a server only the client has."
needs-browser-sign-in = "The command opens a browser for a person to sign in."
windows-only = "The command works only on Windows, and no test on Windows can run it either."
destructive = "The command deletes or replaces something a test must not touch."
illustration = "The block shows a shape, a sketch or a pattern. It is not a command to type or a file to copy."
awaits-the-rewrite = "The document is about to be rewritten, and the block goes or is fixed with it."

# A context is the folder a block runs in. Blocks of one document that name the same context run in the order
# they appear, in one folder, so a later block finds what an earlier one made.
#   base          "empty" (a new folder) or "release-copy" (a copy of every file of the release)
#   git           true starts the copy as a Git repository holding one commit
#   needs_env     the context runs only when each of these variables is set; otherwise its blocks are counted
#                 as skipped, and `check --all-contexts` fails them
#   pass_env      more variables a block of this context may read
#   home          "temporary" (the default) gives a block an empty home folder; "real" keeps the real one
#   timeout       seconds one block may take (default 120)
#   placeholders  the value of each <placeholder> a block of this context uses: text, or env:NAME

[contexts.scratch]
base = "empty"
about = "An empty folder. For a command that needs nothing from the release."

[contexts.release-copy]
base = "release-copy"
about = "A copy of the release, as a plain folder. For a quick command that reads or changes the release."

[contexts.release-git]
base = "release-copy"
git = true
about = "A copy of the release in a new Git repository with one commit. For a quick command that uses Git."

[contexts.slow]
base = "release-copy"
git = true
needs_env = ["DOC_SNIPPETS_SLOW"]
timeout = 1800
about = "The same copy, for commands that take minutes, such as the whole check. Set DOC_SNIPPETS_SLOW=1."

[contexts.stores]
base = "release-copy"
needs_env = ["KPI_STORE_TEST_FUSEKI_URL", "KPI_STORE_TEST_NEO4J_URI"]
pass_env = ["KPI_STORE_TEST_NEO4J_USER", "KPI_STORE_TEST_NEO4J_PASSWORD"]
timeout = 900
about = "A copy of the release beside a local Fuseki and a local Neo4j test server, named by the variables."

[contexts.stores.placeholders]
"your Fuseki address" = "env:KPI_STORE_TEST_FUSEKI_URL"
"your Neo4j address" = "env:KPI_STORE_TEST_NEO4J_URI"

[contexts.databricks-free]
base = "release-copy"
needs_env = ["KPI_STORE_TEST_DATABRICKS_PROFILE"]
home = "real"
timeout = 1800
about = "A copy of the release, with the rehearsal workspace's command-line profile named by the variable."

[contexts.databricks-free.placeholders]
"your profile" = "env:KPI_STORE_TEST_DATABRICKS_PROFILE"

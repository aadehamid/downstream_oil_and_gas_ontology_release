# Runs on every pull request, and every job must pass.
# check: the release's check script, scripts/check.sh, on Linux and on Windows under Git Bash. The job sets no
#   encoding variable, so on Windows Python reads text as cp1252 unless the code names UTF-8, as on most machines.
# check-plain-account: the same check script on Windows as an account without administrator rights meets it: no
#   symbolic link can be made, and no py launcher is on PATH. It gets no secret.
# sign-in: says whether this run has the three secrets of the rehearsal Databricks workspace.
# stores: the whole chain of the stores runbook on Windows, as a person runs it, against servers the job starts on the
#   runner and against the rehearsal Databricks workspace. It has three parts, which run side by side.
#
# Who can start a run that gets the three Databricks secrets: a pull request from a branch of this repository, and a
# manual run. Both need the right to write to this repository, and a person with that right could also change this
# file. Who cannot: a pull request from a fork, to which GitHub gives no secret. The secrets are named only in the
# two steps that need them, never for a whole job, and neither step runs a program from the checkout: one asks
# whether the secrets are there, the other writes the sign-in file and the settings with code that stands in this
# file. No step traces its commands, prints a secret or a settings file, or uploads a file. After a failure the last
# step prints the end of the servers' logs and of the check script's log, which hold neither.
name: check
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # The test run alone took 26 to 61 minutes on Ubuntu, and the Windows job 60 to 71 minutes, as the forms
    # added tests that each build and apply a release. 75 minutes cancelled one Ubuntu run whose checks all passed.
    # The AI drafting tests took Ubuntu from 1 h 49 min to past 120 minutes, which cancelled both runs, so it gets
    # 180.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      # The documents and the steps below start Python with the word python. It must be the 3.12 that this job set
      # up, in each of the three shells a reader may type a command in.
      - name: python is the Python this job set up, in Git Bash, PowerShell and cmd
        if: runner.os == 'Windows'
        run: |
          cat > "$RUNNER_TEMP/which_python.py" <<'PY'
          import os, sys
          here, want = os.path.normcase(sys.executable), os.path.normcase(os.environ["pythonLocation"])
          print(here)
          sys.exit(0 if here.startswith(want) and sys.version_info[:2] == (3, 12) else 1)
          PY
          script="$(cygpath -w "$RUNNER_TEMP/which_python.py")"
          echo "Git Bash:"; python "$script"
          echo "PowerShell:"; pwsh -NoProfile -NonInteractive -Command "python '$script'; exit \$LASTEXITCODE"
          echo "cmd:"; MSYS_NO_PATHCONV=1 cmd /d /c "python $script"
      - name: check.sh
        env:
          PYTEST_ADDOPTS: -rs   # name each skipped test and why, so a skip on one system is seen
        run: bash scripts/check.sh
      # The notebook and the modules it reaches run in Databricks, on the Python of the compute. Serverless compute of
      # environment version 1 has Python 3.10, older than any Python the check script itself accepts, and the first
      # real run failed there. So their tests run again here on Python 3.10, which uv fetches.
      - name: the notebook's side on Python 3.10
        run: bash scripts/check-notebook-side.sh 3.10
      # The runbook has the reader unpack the zip and commit the folder to Git before any change. The runner zips every
      # file of a plain folder and the tracked files of a Git folder, and both must be one zip, also where Git for
      # Windows could change line ends.
      - name: one zip from the plain folder and from the Git folder
        run: bash scripts/check-git-copy.sh
      # check.sh leaves out the tests that ask whether the tree still equals the release as shipped. This branch is
      # the release as shipped, so they must pass here. One system is enough: they compare files, not behaviour.
      - name: check-pinned.sh
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/check-pinned.sh

  # The first real run of the release was on a Windows laptop without administrator rights, with a Python from a
  # virtual environment. Two things differ there from the runner of the job above, and the check script failed on
  # both: the account cannot make a symbolic link (WinError 1314), and `py` is not on PATH. This job makes the runner
  # the same in both ways and runs the check script again.
  #   links  The runner is an administrator, so Windows would let it make a link. scripts/no-links/sitecustomize.py
  #          makes os.symlink fail in every Python that inherits PYTHONPATH and KPI_CHECK_NO_LINKS. A Python that a
  #          test starts with a clean environment is not reached, so this proves less than a real plain account.
  #   py     Every py launcher on PATH is renamed, and the job fails unless bash, PowerShell and cmd all find none.
  # The last step reads the log: tests were skipped for the link. Without those lines the job would pass on a runner
  # that was never made plain. Nothing is skipped for the launcher: no command of the release starts py, and the
  # document test fails a block that does, so a passing check here means that nothing needed it. It gets no secret.
  check-plain-account:
    name: check (no links, no py)
    runs-on: windows-2025
    # This job took 43 to 63 minutes on recent runs, and 60 minutes once cancelled a run, so it gets the same limit.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: take every py launcher off PATH
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 20; $i++) {
            $found = Get-Command py -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { break }
            Write-Output "renaming $($found.Source)"
            Rename-Item -LiteralPath $found.Source -NewName ((Split-Path -Leaf $found.Source) + ".off")
          }
          if (Get-Command py -ErrorAction SilentlyContinue) { Write-Output "::error::PowerShell still finds py"; exit 1 }
          cmd /d /c "where py >nul 2>nul"
          if ($LASTEXITCODE -eq 0) { Write-Output "::error::cmd still finds py"; exit 1 }
          Write-Output "PowerShell and cmd find no py"
          # "where" ended with 1 because it found nothing, which is the wanted result. Without this line the
          # step would end with that exit code and fail.
          exit 0
      - name: bash finds no py
        run: |
          if command -v py >/dev/null 2>&1; then echo "::error::bash still finds py at $(command -v py)"; exit 1; fi
      # The documents and the steps below start Python with the word python. It must be the 3.12 that this job set
      # up, in each of the three shells a reader may type a command in.
      - name: python is the Python this job set up, in Git Bash, PowerShell and cmd
        run: |
          cat > "$RUNNER_TEMP/which_python.py" <<'PY'
          import os, sys
          here, want = os.path.normcase(sys.executable), os.path.normcase(os.environ["pythonLocation"])
          print(here)
          sys.exit(0 if here.startswith(want) and sys.version_info[:2] == (3, 12) else 1)
          PY
          script="$(cygpath -w "$RUNNER_TEMP/which_python.py")"
          echo "Git Bash:"; python "$script"
          echo "PowerShell:"; pwsh -NoProfile -NonInteractive -Command "python '$script'; exit \$LASTEXITCODE"
          echo "cmd:"; MSYS_NO_PATHCONV=1 cmd /d /c "python $script"
      - name: no Python can make a link
        env:
          KPI_CHECK_NO_LINKS: "1"
          PYTHONPATH: ${{ github.workspace }}/scripts/no-links
        run: |
          if python -c 'import os, tempfile; os.symlink("a", os.path.join(tempfile.mkdtemp(), "b"))' 2>/dev/null; then
            echo "::error::python made a link, so the simulation is not on"; exit 1
          fi
          if uv run -q --no-project python -c 'import os, tempfile; os.symlink("a", os.path.join(tempfile.mkdtemp(), "b"))' 2>/dev/null; then
            echo "::error::the Python of uv run made a link, so the simulation is not on"; exit 1
          fi
          echo "no Python of this job makes a link"
      - name: check.sh
        env:
          KPI_CHECK_NO_LINKS: "1"
          PYTHONPATH: ${{ github.workspace }}/scripts/no-links
          PYTEST_ADDOPTS: -rs   # name each skipped test and why: the next step reads those lines
        run: bash scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: the log shows that tests were skipped for the link
        run: |
          links="$(grep -c 'does not let the test make a link\|cannot make a symbolic link\|cannot make a link' "$RUNNER_TEMP/check.log" || true)"
          echo "skips for a link: $links"
          [ "$links" -ge 3 ] || { echo "::error::fewer than 3 skip lines name a link"; exit 1; }
          grep -q '^all checks passed$' "$RUNNER_TEMP/check.log" || { echo "::error::no line 'all checks passed'"; exit 1; }

  # The stores job signs in to a rehearsal Databricks workspace. The sign-in is three secrets of this repository's
  # settings: KPI_CI_DATABRICKS_TOKEN, KPI_CI_DATABRICKS_HOST and KPI_CI_DATABRICKS_WAREHOUSE. The release itself holds
  # no token, no workspace address and no warehouse id, and no step prints one. GitHub gives no secret to a pull
  # request from a fork: such a run skips the stores job and says so. On a branch of this repository the secrets
  # must be there, and a run without them fails here.
  sign-in:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      databricks: ${{ steps.secrets.outputs.databricks }}
    steps:
      - name: are the three Databricks secrets there
        id: secrets
        env:
          TOKEN: ${{ secrets.KPI_CI_DATABRICKS_TOKEN }}
          HOST: ${{ secrets.KPI_CI_DATABRICKS_HOST }}
          WAREHOUSE: ${{ secrets.KPI_CI_DATABRICKS_WAREHOUSE }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$HOST" ] && [ -n "$WAREHOUSE" ]; then
            echo "databricks=on" >> "$GITHUB_OUTPUT"
          elif [ "$FORK" = "true" ]; then
            echo "::notice::This pull request comes from a fork, and GitHub gives a fork no secret. The stores job, which signs in to the rehearsal Databricks workspace, is skipped. The job check still runs."
            echo "databricks=off" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The stores job cannot sign in to the rehearsal Databricks workspace: KPI_CI_DATABRICKS_TOKEN, KPI_CI_DATABRICKS_HOST or KPI_CI_DATABRICKS_WAREHOUSE is empty. Set all three under Settings, Secrets and variables, Actions."
            exit 1
          fi

  # The stores runbook's chain on Windows, with the commands a person runs. The servers run on the runner and listen
  # on 127.0.0.1 only. One Neo4j Enterprise server (evaluation licence) holds both databases: neo4j, with the n10s and
  # APOC plugins, stands for the local Neo4j, and businessprocessarchitecturegraph stands for the Enterprise target.
  #
  # The machine is set up as the runbook sets up one without administrator rights: no installer, Java and the
  # Databricks command line unpacked from their zips and named in the local settings, no Java on PATH, and every
  # folder under the runner's temporary folder. Git for Windows and Python are the runner's own.
  #
  # Databricks is a rehearsal workspace, never the client's. The job writes the command line's profile DEFAULT into
  # the runner's own .databrickscfg from the secrets, as `databricks auth login` leaves it for a reader; the SDK reads
  # the same profile. The settings name the two rehearsal catalogs: kpi_reh_idp_sbx plays idp_sbx and
  # kpi_reh_synapse_dev plays synapse_dev. `python scripts/rehearsal_workspace.py create` builds both catalogs and
  # their made-up objects, and `drop` removes them. Each part writes to two schemas of its own, named after this run,
  # and to one workspace folder of its own. The last steps drop exactly those two schemas and that folder, also after a
  # failure. The job creates, changes and drops nothing else in the workspace.
  #
  # The parts:
  #   run    the setup check with all 15 checks, the first run, which stops on the report, the cleared report, the
  #          second run with its two typed answers, and the sync check. No step is left out, so the check script runs
  #          inside each run, 35 to 65 minutes each on this runner. The part took 1 h 46 min and 1 h 52 min, and on a slow
  #          day it was cancelled at 2 h in its second run, so it gets 3 h. On 2026-11-22 its first run took 1 h 46 min
  #          (62 minutes the run before) and 3 h cancelled it in the second run, so it gets 5 h, under GitHub's 6.
  #   reset  the document test for the blocks that need this job's Neo4j server or a Windows account. Then the same
  #          chain with --skip check, which the runbook gives for a machine where the check step cannot run, and on the
  #          loaded stores: the reset with the typed word, a sync check that must read unmarked, the load again,
  #          --replace-enterprise on a copy made incomplete, the sync check, and the reset with --yes.
  #   from11 the move from 1.1 (KPI-DEC-0006, item 4): 1.1 as shipped, in a folder of its own, loads the stores with
  #          its own code and runbook; then this release runs in its place, with the same local folder and settings
  #          and --skip check, with the same decisions. Each store must then read current, Enterprise included: the
  #          same decisions on the same ontology build the graph 1.1 loaded, so the copy has nothing to replace.
  #   from11r the same move, with one decision changed: this release leaves one column-case row undecided, which 1.1
  #          accepted, so it builds a graph that differs from the one 1.1 copied to Enterprise. The second run must
  #          stop at Enterprise and change nothing there; the runner with --from enterprise --replace-enterprise must
  #          then replace 1.1's nodes, and each store must read current. This is the handout's "Coming from KPI
  #          Store 1.1", step 4. Part reset replaces a copy of this release's own graph made incomplete.
  # What this job does not run is in scripts/DOC-SNIPPETS.md, "Blocks the test does not run".
  stores:
    needs: sign-in
    if: needs.sign-in.outputs.databricks == 'on'
    strategy:
      fail-fast: false
      matrix:
        part: [run, reset, from11, from11r]
    runs-on: windows-2025
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      # The commands start Python with the word python, as the documents do. That is the 3.12 which the set-up step
      # below puts first on PATH; a step checks it in Git Bash, PowerShell and cmd. From 3.15 Python reads text as
      # UTF-8 by default. 3.12 still reads cp1252 on Windows, as most machines do, so the commands run on 3.12.
      NEO4J_ACCEPT_LICENSE_AGREEMENT: eval
      FUSEKI_SHA256: 2c92c598e65ab69d99820052e05f4277ed1d77980a8845f87545ad35b71a76ee
      N10S_SHA256: 4c461087e08405c7cb472ecfefc043e9e8ed93628ed74988e4fda1f1bac54b3e
      APOC_SHA256: 4df40cea7444ea193d08f8a679aa998c498196fe149c8c02badb998f1c9580fb
      ROBOT_SHA256: 16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105
      NEO4J_ZIP_SHA256: 1b1cf3715fbf6a7632d2d221b9eaccdd34037baaa4ddb7242b2ecfecf473b378
      # Java and the Databricks command line come from their zips, as the runbook's section "Install the programs
      # without administrator rights" has them: Eclipse Temurin 21.0.13+9 and Databricks CLI 1.26.0.
      JDK_ZIP_SHA256: a4dbaa05fca4bd89d84584e58c459bd732efebb1722af80ab13c6516832004f9
      CLI_ZIP_SHA256: 7c7f2bdfc503d0277d60ef36d9ef6d9577769cd992bd3633691ebe47b9f214a2
      # What this part may write to in the rehearsal workspace, and nothing else: two schemas and one folder.
      CI_CATALOG: kpi_reh_idp_sbx
      CI_SCHEMA: kpi_store_ci_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.part }}
      CI_FOLDER: /Workspace/Shared/kpi_store_ci_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.part }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      # The documents and the steps below start Python with the word python. It must be the 3.12 that this job set
      # up, in each of the three shells a reader may type a command in.
      - name: python is the Python this job set up, in Git Bash, PowerShell and cmd
        run: |
          cat > "$RUNNER_TEMP/which_python.py" <<'PY'
          import os, sys
          here, want = os.path.normcase(sys.executable), os.path.normcase(os.environ["pythonLocation"])
          print(here)
          sys.exit(0 if here.startswith(want) and sys.version_info[:2] == (3, 12) else 1)
          PY
          script="$(cygpath -w "$RUNNER_TEMP/which_python.py")"
          echo "Git Bash:"; python "$script"
          echo "PowerShell:"; pwsh -NoProfile -NonInteractive -Command "python '$script'; exit \$LASTEXITCODE"
          echo "cmd:"; MSYS_NO_PATHCONV=1 cmd /d /c "python $script"
      # Part from11 stands for a team that loaded KPI Store 1.1 and then moves to this release, as KPI-DEC-0006 (item 4)
      # records: 1.1 as shipped, from the kpi-store/1.1 branch, loads the stores first from a folder of its own; then
      # the checkout runs in its place, with the same local folder and settings.
      - name: the 1.1 release as shipped, in a folder of its own (part from11)
        if: startsWith(matrix.part, 'from11')
        run: |
          git fetch -q --depth=1 origin kpi-store/1.1
          old="$(cygpath -m "$RUNNER_TEMP")/kpi-store-1.1-old"
          mkdir -p "$old"
          git archive FETCH_HEAD | tar -x -C "$old"
          cd "$old"
          git init -q
          git config user.name "KPI Store test job"
          git config user.email "test-job@example.invalid"
          git add -A
          git commit -q -m "KPI Store 1.1 as shipped"
          grep -q '"release": "KPI Store 1.1"' release.json
          echo "OLD=$old" >> "$GITHUB_ENV"
      - name: folders
        run: |
          local="$(cygpath -m "$RUNNER_TEMP")/kpi-local"
          mkdir -p "$local/dl" "$local/runs"
          echo "LOCAL=$local" >> "$GITHUB_ENV"
          echo "KPI_STORE_LOCAL=$local/stores.toml" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kpi-local/dl
          key: store-downloads-${{ env.FUSEKI_SHA256 }}-${{ env.N10S_SHA256 }}-${{ env.APOC_SHA256 }}-${{ env.ROBOT_SHA256 }}-${{ env.NEO4J_ZIP_SHA256 }}-${{ env.JDK_ZIP_SHA256 }}-${{ env.CLI_ZIP_SHA256 }}
      - name: downloads, each checked against its pinned SHA-256
        run: |
          cd "$LOCAL/dl"
          fetch() {  # <file> <sha256> <url>
            [ -f "$1" ] || curl -sSfL --retry 3 -o "$1" "$3"
            echo "$2 *$1" | sha256sum -c -
          }
          fetch jena-fuseki-server-6.2.0.jar "$FUSEKI_SHA256" https://repo1.maven.org/maven2/org/apache/jena/jena-fuseki-server/6.2.0/jena-fuseki-server-6.2.0.jar
          fetch neosemantics-2025.06.1.jar "$N10S_SHA256" https://github.com/neo4j-labs/neosemantics/releases/download/2025.06.1/neosemantics-2025.06.1.jar
          fetch apoc-2025.06.2-core.jar "$APOC_SHA256" https://github.com/neo4j/apoc/releases/download/2025.06.2/apoc-2025.06.2-core.jar
          fetch robot.jar "$ROBOT_SHA256" https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar
          fetch neo4j-enterprise-2025.06.2-windows.zip "$NEO4J_ZIP_SHA256" https://dist.neo4j.org/neo4j-enterprise-2025.06.2-windows.zip
          fetch temurin-jdk-21.zip "$JDK_ZIP_SHA256" https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_windows_hotspot_21.0.13_9.zip
          fetch databricks-cli.zip "$CLI_ZIP_SHA256" https://github.com/databricks/cli/releases/download/v1.26.0/databricks_cli_1.26.0_windows_amd64.zip
      - name: the packages, at the versions the setup check names, for the Python that the word python starts
        run: |
          python -c "import sys; print(sys.executable, sys.version)"
          python -m pip install -q rdflib==7.6.0 pyshacl==0.40.2 owlrl==7.6.2 pyoxigraph==0.5.13 neo4j==6.4.1 databricks-sdk==0.164.0 sqlglot==30.31.0 pyyaml==6.0.3 openpyxl==3.1.5
      # No installer and no administrator rights, as the runbook's section "Install the programs without administrator
      # rights" does it: Java and the Databricks command line are unpacked from their zips into the local folder, and
      # the local settings name both. Then every Java that the runner image brings is taken off PATH for the rest of
      # the job, and JAVA_HOME is emptied, so that a command which looked for Java anywhere but in the settings would
      # fail here.
      - name: Java and the Databricks command line, unpacked from their zips
        run: |
          cd "$LOCAL"
          unzip -q dl/temurin-jdk-21.zip
          mv jdk-21* jdk-21
          mkdir databricks-cli
          unzip -q dl/databricks-cli.zip -d databricks-cli
          [ -f databricks-cli/databricks.exe ] || mv "$(find databricks-cli -name databricks.exe | head -n 1)" databricks-cli/databricks.exe
          jdk-21/bin/java.exe -version
          databricks-cli/databricks.exe --version
      - name: take every other Java off PATH
        shell: pwsh
        run: |
          $kept = $env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'java.exe')) }
          "Path=$($kept -join ';')" >> $env:GITHUB_ENV
          "JAVA_HOME=" >> $env:GITHUB_ENV
      - name: no Java is on PATH, and JAVA_HOME names none
        run: |
          python -c "import os, shutil, sys; found = shutil.which('java'); sys.exit(f'a Java is still on PATH: {found}' if found else ('JAVA_HOME is still set' if os.environ.get('JAVA_HOME') else 0))"
      # The token goes from the secret into the runner's own .databrickscfg, and from there to the command line and
      # the SDK. No step prints it, and the file is deleted in the last step. The warehouse id goes into the
      # environment's settings file in the runner's temporary folder, which no step prints or uploads.
      - name: sign in, and the two settings files, outside the checkout
        env:
          TOKEN: ${{ secrets.KPI_CI_DATABRICKS_TOKEN }}
          HOST: ${{ secrets.KPI_CI_DATABRICKS_HOST }}
          WAREHOUSE: ${{ secrets.KPI_CI_DATABRICKS_WAREHOUSE }}
        run: |
          # -I keeps the checkout off Python's path: with the secrets in this step's environment, only Python's own
          # modules and the code written here may run.
          python -I -c "import secrets; print(secrets.token_hex(16))" > "$LOCAL/pw"
          pw="$(cat "$LOCAL/pw")"; rm "$LOCAL/pw"
          echo "::add-mask::$pw"
          echo "KPI_CI_NEO4J_PASSWORD=$pw" >> "$GITHUB_ENV"
          python -I - <<'PY'
          import os, re
          from pathlib import Path
          from urllib.parse import quote, urlsplit
          env = os.environ
          # GitHub hides a secret's exact text in the log. An error of the command line or of the SDK may print the
          # workspace's address in another form, so each such form is hidden too.
          host = urlsplit(env["HOST"]).hostname or env["HOST"]
          for form in {host, host.split(".")[0], quote(env["HOST"], safe=""), env["HOST"].rstrip("/") + "/"}:
              print(f"::add-mask::{form}")
          (Path.home() / ".databrickscfg").write_text(f"[DEFAULT]\nhost = {env['HOST']}\ntoken = {env['TOKEN']}\n",
                                                      encoding="utf-8", newline="\n")
          # The environment's settings: the example file, with the rehearsal catalogs and this run's two schemas.
          # Parts from11 and from11r make them from 1.1's example file, as the team's own settings were made.
          text = Path(env.get("OLD") or ".", "kpi_store/kpi_store.example.toml").read_text(encoding="utf-8")
          for line, new in (
                  ('write_catalog = "idp_sbx"', f'write_catalog = "{env["CI_CATALOG"]}"'),
                  ('write_schema = "kpi_store"', f'write_schema = "{env["CI_SCHEMA"]}"'),
                  ('tech_graph_schema = "tech_graph"', f'tech_graph_schema = "{env["CI_SCHEMA"]}_tech"'),
                  ('read_catalogs = ["idp_sbx", "synapse_dev"]', 'read_catalogs = ["kpi_reh_idp_sbx", "kpi_reh_synapse_dev"]'),
                  ('warehouse_id = ""', f'warehouse_id = "{env["WAREHOUSE"]}"'),
                  ('idp_sbx = "idp_sbx"', 'idp_sbx = "kpi_reh_idp_sbx"'),
                  ('synapse_dev = "synapse_dev"', 'synapse_dev = "kpi_reh_synapse_dev"'),
                  ('schemas = ["information_schema", "bronze_replica_*", "kpi_store_poc"]',
                   'schemas = ["information_schema", "bronze_replica_*", "kpi_store_poc", "epm_ontology", "o2c_unbilled"]')):
              text, count = re.subn("(?m)^" + re.escape(line), lambda m: new, text)
              assert count == 1, f"kpi_store.example.toml has no line that starts with: {line}"
          Path(env["LOCAL"], "kpi_store.toml").write_text(text, encoding="utf-8", newline="\n")
          PY
          cat > "$LOCAL/stores.toml" <<EOF
          [release]
          settings = "$LOCAL/kpi_store.toml"
          run_folder = "$LOCAL/runs"

          [databricks]
          profile = "DEFAULT"
          workspace_folder = "$CI_FOLDER"
          timeout_minutes = 40
          cli = "$LOCAL/databricks-cli/databricks.exe"

          [fuseki]
          jar = "$LOCAL/dl/jena-fuseki-server-6.2.0.jar"
          url = "http://127.0.0.1:13030/ds"
          data_folder = "$LOCAL/fuseki-db"
          java = "$LOCAL/jdk-21/bin/java.exe"

          [neo4j.local]
          uri = "bolt://127.0.0.1:17687"
          username = "neo4j"
          password_env = "KPI_CI_NEO4J_PASSWORD"
          database = "neo4j"
          plugins_folder = "$LOCAL/neo4j-enterprise-2025.06.2/plugins"

          [neo4j.enterprise]
          uri = "bolt://127.0.0.1:17687"
          username = "neo4j"
          password_env = "KPI_CI_NEO4J_PASSWORD"
          database = "businessprocessarchitecturegraph"

          [projection]
          robot_jar = "$LOCAL/dl/robot.jar"
          out = "$LOCAL/lpg-out"
          EOF
      # The job's Neo4j server stands for Neo4j Desktop, which brings its own Java. So these two steps, and no
      # other, get JAVA_HOME: the server starts with the unpacked JDK.
      - name: unpack Neo4j, add APOC and n10s, set the password
        shell: pwsh
        env:
          JAVA_HOME: ${{ env.LOCAL }}/jdk-21
        run: |
          $neo = "$env:LOCAL/neo4j-enterprise-2025.06.2"
          & "$env:SystemRoot/System32/tar.exe" -xf "$env:LOCAL/dl/neo4j-enterprise-2025.06.2-windows.zip" -C $env:LOCAL
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "$env:LOCAL/dl/neosemantics-2025.06.1.jar", "$env:LOCAL/dl/apoc-2025.06.2-core.jar" "$neo/plugins/"
          Add-Content -Path "$neo/conf/neo4j.conf" -Value @(
            "server.default_listen_address=127.0.0.1",
            "server.bolt.listen_address=127.0.0.1:17687",
            "server.http.listen_address=127.0.0.1:17474",
            "dbms.security.procedures.unrestricted=apoc.*,n10s.*",
            "dbms.usage_report.enabled=false")
          & "$neo/bin/neo4j-admin.bat" dbms set-initial-password $env:KPI_CI_NEO4J_PASSWORD
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Started with its own hidden console and no tie to this step: a server on the step's console ends with the step.
      - name: start Neo4j and wait for it
        env:
          JAVA_HOME: ${{ env.LOCAL }}/jdk-21
        run: |
          python - <<'PY'
          import os, socket, subprocess, sys, time
          local = os.environ["LOCAL"]
          log = open(local + "/neo4j-console.log", "ab")
          bat = os.path.normpath(local + "/neo4j-enterprise-2025.06.2/bin/neo4j.bat")
          subprocess.Popen([bat, "console"], stdin=subprocess.DEVNULL, stdout=log,
                           stderr=subprocess.STDOUT, creationflags=subprocess.CREATE_NO_WINDOW | subprocess.CREATE_NEW_PROCESS_GROUP)
          for _ in range(240):
              time.sleep(1)
              try:
                  socket.create_connection(("127.0.0.1", 17687), timeout=2).close()
                  print("Neo4j answers on 127.0.0.1:17687")
                  sys.exit(0)
              except OSError:
                  pass
          sys.exit("Neo4j did not answer within 240 seconds")
          PY
      - name: the second database, which stands for the Enterprise target
        run: |
          python - <<'PY'
          import os, neo4j
          with neo4j.GraphDatabase.driver("bolt://127.0.0.1:17687", auth=("neo4j", os.environ["KPI_CI_NEO4J_PASSWORD"])) as driver:
              driver.execute_query("CREATE DATABASE businessprocessarchitecturegraph IF NOT EXISTS WAIT", database_="system")
              for row in driver.execute_query("SHOW DATABASES YIELD name, currentStatus", database_="system").records:
                  print(row["name"], row["currentStatus"])
          PY
      - name: setup check, which must pass all 15 checks
        run: |
          python -m kpi_store.setup_check | tee "$LOCAL/setup-check.log"
          grep -q "^15 of 15 checks passed" "$LOCAL/setup-check.log"

      # ---- part reset, first: the Fuseki load as its own command, and the document test ----
      # Both come before the first run. After the cut the document test would read the blocks and run none.
      - name: setup check, list
        if: matrix.part == 'reset'
        run: python -m kpi_store.setup_check --list
      - name: Fuseki load
        if: matrix.part == 'reset'
        run: time python -m kpi_store.load_fuseki --json
      - name: Fuseki load again, which must change nothing
        if: matrix.part == 'reset'
        run: time python -m kpi_store.load_fuseki --json
      - name: sync check, Jena
        if: matrix.part == 'reset'
        run: time python -m kpi_store.sync_check --store jena --no-tech-graph
      # The blocks of the runbook and of the three hand-written pages that need this job's Neo4j server or a Windows
      # account that may be changed: the winget install, the setx command and the cd of the runbook, the two
      # shared-drive commands of the form's guide (on a stand-in drive S:), the Cypher of "How to undo" (on a
      # database of its own, made and dropped here), and the four commands of the cross-graph questions (on a
      # composite database over two made-up graphs, made and dropped here). The packages are those of
      # scripts/check.sh. kpi-store in the user folder is where the runbook unpacks the release.
      - name: document test, the blocks that need the Neo4j server or a Windows account
        if: matrix.part == 'reset'
        env:
          KPI_STORE_TEST_NEO4J_URI: bolt://127.0.0.1:17687
          KPI_STORE_TEST_NEO4J_USER: neo4j
          DOC_SNIPPETS_WINDOWS_ACCOUNT: "1"
          DOC_SNIPPETS_SHARED_DRIVE: "1"
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p "$USERPROFILE/kpi-store"
          # The stand-in for the client's shared drive that the form's guide names: drive S: over a folder of this
          # runner, with the release's signed example where the guide's check command looks for it.
          mkdir -p "$RUNNER_TEMP/shared-drive/Commercial Planning/Shared/KPI-intake/2-ready-for-check"
          cp kpi-intake/examples/crack-spreads-pricing.json \
             "$RUNNER_TEMP/shared-drive/Commercial Planning/Shared/KPI-intake/2-ready-for-check/crack-spreads-pricing.kpi-intake.json"
          MSYS_NO_PATHCONV=1 subst S: "$(cygpath -w "$RUNNER_TEMP/shared-drive")"
          # winget asks a person to agree to the terms of its sources on first use. This answers that once, so the
          # runbook's plain install command, which the document test runs below, meets no question. What it installs
          # serves no later step: the settings file names the program unpacked from the ZIP file.
          winget list Databricks.DatabricksCLI --accept-source-agreements --disable-interactivity || true
          export KPI_STORE_TEST_NEO4J_PASSWORD="$KPI_CI_NEO4J_PASSWORD"
          uv run -q --no-project --with pytest==9.2.0 --with pytest-xdist==3.8.0 --with rdflib==7.6.0 --with pyshacl==0.40.2 --with owlrl==7.6.2 --with openpyxl==3.1.5 --with jsonschema==4.26.0 --with markdown-it-py==4.3.0 --with pyyaml==6.0.3 --with sqlglot==30.31.0 --with pyoxigraph==0.5.13 --with neo4j==6.4.1 --with kgcl-schema==0.7.0 --with pip==26.3 \
            python scripts/doc_snippets.py check --verbose \
            business_architecture/ontology/projection/ontology-stores-runbook.md \
            business_architecture/ontology/epm-ontology-guide.html \
            business_architecture/ontology/epm-walkthrough.html \
            kpi-intake/how-to-use-the-form.html | tee "$LOCAL/doc-test.log"
          # A block whose context is off is counted, not failed. These must have run here.
          for ran in "cmd run=windows-account: ran" "powershell run=windows-account: ran" "cypher run=enterprise-database: ran" \
                     "cypher run=scratch-database: ran" "epm-ontology-guide.html:[0-9]*: powershell run=questions: ran" \
                     "epm-walkthrough.html:[0-9]*: powershell run=questions: ran"; do
            grep -q "$ran" "$LOCAL/doc-test.log" || { echo "no block reads: $ran"; exit 1; }
          done
          # The runbook has three blocks of the Windows account: winget in cmd, and the setx command and the cd in
          # PowerShell. The guide has two commands on the shared drive. Each must have run, so the counts are checked,
          # not only that one ran.
          [ "$(grep -c "ontology-stores-runbook.md:[0-9]*: cmd run=windows-account: ran" "$LOCAL/doc-test.log")" = 1 ] || { echo "the cmd block of the runbook did not run"; exit 1; }
          [ "$(grep -c "ontology-stores-runbook.md:[0-9]*: powershell run=windows-account: ran" "$LOCAL/doc-test.log")" = 2 ] || { echo "not both PowerShell blocks of the runbook's Windows account ran"; exit 1; }
          [ "$(grep -c "how-to-use-the-form.html:[0-9]*: powershell run=shared-drive: ran" "$LOCAL/doc-test.log")" = 2 ] || { echo "not both shared-drive blocks of the guide ran"; exit 1; }
      - name: the variable that the runbook's setx command set
        if: matrix.part == 'reset'
        shell: pwsh
        run: |
          $account = Get-ItemProperty -Path HKCU:\Environment
          "KPI_STORE_LOCAL = $($account.KPI_STORE_LOCAL)"
          if ($account.KPI_STORE_LOCAL -ne "$HOME\kpi-store-local\stores.toml") { exit 1 }
          # The runbook's two commands with the user folder in them, for a user name that holds a space. PowerShell lets no
          # script set its user folder variable, so another variable stands for it; the quoting and the expansion are the same.
          $folder = Join-Path $env:RUNNER_TEMP "Jo Smith"
          New-Item -ItemType Directory -Force "$folder\kpi-store" | Out-Null
          setx KPI_STORE_QUOTING_TEST "$folder\kpi-store-local\stores.toml" | Out-Null
          $saved = (Get-ItemProperty -Path HKCU:\Environment).KPI_STORE_QUOTING_TEST
          Remove-ItemProperty -Path HKCU:\Environment -Name KPI_STORE_QUOTING_TEST
          "with a space: $saved"
          if ($saved -ne "$folder\kpi-store-local\stores.toml") { exit 1 }
          cd $folder\kpi-store
          if ((Get-Location).Path -ne "$folder\kpi-store") { exit 1 }

      # ---- every part: the first run, the cleared report, the second run ----
      # Part run's second run gives no option, as the runbook's "The second run" does, so the runner's check step runs
      # the whole check on the copy the cut corrected. Its first run, and both runs of part reset, add --skip check,
      # the runbook's own fallback: the first run's check reads the release as shipped, which the check jobs above
      # prove already, and each whole check took this job close to two hours on Windows (4 h 21 min for the job on
      # 2026-11-22, of a 5 h limit).
      # ---- part from11: 1.1 loads the stores first, with its own code and its own runbook ----
      - name: 1.1, the first run, which must stop on the report with exit code 3 (part from11)
        if: startsWith(matrix.part, 'from11')
        run: |
          cd "$OLD"
          code=0
          python -m kpi_store.runner --skip check | tee "$LOCAL/first-run-1.1.log" || code=$?
          echo "exit code $code"
          [ "$code" -eq 3 ]
          grep -q "^report: STOPPED" "$LOCAL/first-run-1.1.log"
      - name: 1.1, clear the report, with 1.1's runbook block (part from11)
        if: startsWith(matrix.part, 'from11')
        run: |
          cd "$OLD"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import doc_snippets
          doc = "business_architecture/ontology/projection/ontology-stores-runbook.md"
          blocks, problems = doc_snippets.extract(doc, Path(doc).read_text(encoding="utf-8"))
          found = [b for b in blocks if b.lang == "python" and "discovery-report.to-clear.csv" in b.body]
          assert not problems and len(found) == 1, "1.1's runbook must hold one Python block that clears the report"
          exec(compile(found[0].body, doc, "exec"))
          PY
      - name: 1.1, the second run, which cuts the correction and loads every store (part from11)
        if: startsWith(matrix.part, 'from11')
        run: |
          cd "$OLD"
          printf 'Change_Value_Amount\nyes\n' | python -m kpi_store.runner --skip check | tee "$LOCAL/second-run-1.1.log"
          grep -q "^enterprise: copied" "$LOCAL/second-run-1.1.log"
          git --no-pager tag --list | grep -q correction
      - name: 1.1, sync check, which must read current on every line (part from11)
        if: startsWith(matrix.part, 'from11')
        run: |
          cd "$OLD"
          python -m kpi_store.sync_check
      # ---- every part: the first run, the cleared report, the second run, of this release ----
      - name: which options the runs after the first take in this part
        run: echo "RUN_OPTIONS=${{ matrix.part != 'run' && '--skip check' || '' }}" >> "$GITHUB_ENV"
      - name: the first run, which must stop on the report with exit code 3
        run: |
          code=0
          python -m kpi_store.runner --skip check | tee "$LOCAL/first-run.log" || code=$?
          echo "exit code $code"
          [ "$code" -eq 3 ]
          grep -q "^report: STOPPED" "$LOCAL/first-run.log"
          [ -f "$LOCAL/runs/pending/discovery-report.to-clear.csv" ]
      # The runbook's block "Clear the report" does what a person does in Excel. This step takes that block from the
      # runbook and runs it, so the job clears the report with the same script as the document test.
      - name: clear the report, with the runbook's own block
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import doc_snippets
          doc = "business_architecture/ontology/projection/ontology-stores-runbook.md"
          blocks, problems = doc_snippets.extract(doc, Path(doc).read_text(encoding="utf-8"))
          found = [b for b in blocks if b.lang == "python" and "discovery-report.to-clear.csv" in b.body]
          assert not problems and len(found) == 1, "the runbook must hold one Python block that clears the report"
          exec(compile(found[0].body, doc, "exec"))
          PY
      # Part from11r changes one decision of the cleared report: the first column-case row, which 1.1 accepted, is left
      # without a decision. A column-case row never blocks the load, so the cut goes on with the other rows. The
      # rehearsal workspace has no Genie space, so its report holds no second-source row to change instead.
      - name: leave one column-case row undecided (part from11r)
        if: matrix.part == 'from11r'
        run: |
          python - <<'PY'
          import csv, os, tomllib
          from pathlib import Path
          settings = Path(os.environ["KPI_STORE_LOCAL"])
          with settings.open("rb") as f:
              run_folder = Path(tomllib.load(f)["release"]["run_folder"])
          if not run_folder.is_absolute():
              run_folder = settings.parent / run_folder
          path = run_folder / "pending" / "discovery-report.to-clear.csv"
          with path.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          decided = [row for row in rows if row["kind"] == "column-case" and row["decided_by"]]
          assert decided, "the cleared report must hold a decided column-case row"
          changed = decided[:1]
          for row in changed:
              row["decision"], row["decided_by"] = "", ""
          with path.open("w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=list(rows[0]), lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          print("undecided:", ", ".join(row["id"] for row in changed))
          PY
      # The cut asks two things. The answers come through standard input, as a person types them. The checkout is a
      # Git copy, where the cut commits and tags what it wrote, so Git gets an author first, in this checkout only.
      # The runner has none, and the cut refuses without one, with the two commands a person then runs.
      - name: the second run, with the cut's two typed answers
        run: |
          git config user.name "KPI Store test job"
          git config user.email "test-job@example.invalid"
          code=0
          printf 'Change_Value_Amount\nyes\n' | python -m kpi_store.runner $RUN_OPTIONS | tee "$LOCAL/second-run.log" || code=$?
          echo "exit code $code"
          if [ "${{ matrix.part }}" = from11r ]; then
            # Enterprise holds 1.1's graph, which differs from this one: the copy stops and changes nothing.
            [ "$code" -ne 0 ]
            grep -q "^enterprise: FAILED.*Run the runner again with --from enterprise --replace-enterprise" "$LOCAL/second-run.log"
            exit 0
          fi
          [ "$code" -eq 0 ]
          if [ "${{ matrix.part }}" = from11 ]; then
            # 1.1 loaded the graph these same decisions build, so the copy finds Enterprise current.
            grep -q "^enterprise: current" "$LOCAL/second-run.log"
          else
            grep -q "^enterprise: copied" "$LOCAL/second-run.log"
          fi
          if [ -z "$RUN_OPTIONS" ]; then
            grep -q "^check: all checks passed" "$LOCAL/second-run.log"
            [ "$(tail -n 1 "$LOCAL/second-run.log" | tr -d '\r')" = "every step passed" ]
          else
            tail -n 1 "$LOCAL/second-run.log" | grep -q "^the steps that ran passed; left out: check "
          fi
      - name: sync check, which must read current on every line
        if: matrix.part != 'from11r'
        run: python -m kpi_store.sync_check

      # ---- part from11r: the replace of 1.1's nodes in Enterprise ----
      - name: the enterprise step again, with the replace allowed (part from11r)
        if: matrix.part == 'from11r'
        run: |
          python -m kpi_store.runner --from enterprise --replace-enterprise | tee "$LOCAL/replaced.log"
          grep -q "^enterprise: copied" "$LOCAL/replaced.log"
          grep -q "^sync: all [0-9]* lines read current" "$LOCAL/replaced.log"
      - name: sync check after the replace, which must read current on every line (part from11r)
        if: matrix.part == 'from11r'
        run: python -m kpi_store.sync_check

      # ---- part reset: the reset, the load again, the replace ----
      - name: reset, dry run
        if: matrix.part == 'reset'
        run: python -m kpi_store.runner --reset --dry-run
      # The reset asks for the word reset. The word comes through standard input, as a person types it.
      - name: reset of the four stores, with the typed word
        if: matrix.part == 'reset'
        run: |
          printf 'reset\n' | python -m kpi_store.runner --reset | tee "$LOCAL/reset.log"
          tail -n 1 "$LOCAL/reset.log" | grep -q "^reset done: enterprise, neo4j, fuseki and databricks hold nothing of the KPI Store"
      # After the reset Databricks and the two Neo4j databases read unmarked, and Fuseki, which the reset stopped,
      # reads unreachable. No line may read current.
      - name: sync check after the reset, which must read unmarked and unreachable
        if: matrix.part == 'reset'
        run: |
          python -m kpi_store.sync_check --json > "$LOCAL/after-reset.json" || true
          cat "$LOCAL/after-reset.json"
          python - "$LOCAL/after-reset.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              rows = {row["store"]: row["status"] for row in json.load(f)}
          want = {"databricks": "unmarked", "jena": "unreachable", "neo4j": "unmarked", "enterprise": "unmarked"}
          wrong = {store: (rows.get(store), status) for store, status in want.items() if rows.get(store) != status}
          current = [store for store, status in rows.items() if status == "current"]
          sys.exit(f"after the reset, (found, expected) by store: {wrong}; still current: {current}" if wrong or current else 0)
          PY
      - name: runner again, which loads the emptied stores
        if: matrix.part == 'reset'
        run: |
          python -m kpi_store.runner --skip check | tee "$LOCAL/load-again.log"
          grep -q "^notebook: notebook run [0-9]* loaded" "$LOCAL/load-again.log"
          grep -q "^enterprise: copied" "$LOCAL/load-again.log"
      # --replace-enterprise is for a database that holds KPI Store nodes of another release, or a copy that was cut
      # off halfway. This makes the second case: it deletes 100 of the copied nodes. The copy must then stop and
      # change nothing, and it must pass with the replace allowed.
      - name: make the Enterprise copy incomplete, as a copy that was cut off halfway leaves it
        if: matrix.part == 'reset'
        run: |
          python - <<'PY'
          import os, neo4j
          with neo4j.GraphDatabase.driver("bolt://127.0.0.1:17687", auth=("neo4j", os.environ["KPI_CI_NEO4J_PASSWORD"])) as driver:
              done = driver.execute_query("MATCH (n:Resource) WITH n LIMIT 100 DETACH DELETE n", database_="businessprocessarchitecturegraph")
              print("deleted", done.summary.counters.nodes_deleted, "nodes")
          PY
      - name: the enterprise step, which must stop on the incomplete copy
        if: matrix.part == 'reset'
        run: |
          if python -m kpi_store.runner --only enterprise > "$LOCAL/stopped.log" 2>&1; then cat "$LOCAL/stopped.log"; echo "the copy did not stop"; exit 1; fi
          cat "$LOCAL/stopped.log"
          grep -q "^enterprise: FAILED" "$LOCAL/stopped.log"
      - name: the enterprise step again, with the replace allowed
        if: matrix.part == 'reset'
        run: |
          python -m kpi_store.runner --from enterprise --replace-enterprise | tee "$LOCAL/replaced.log"
          grep -q "^enterprise: copied" "$LOCAL/replaced.log"
          grep -q "^sync: all [0-9]* lines read current" "$LOCAL/replaced.log"
      - name: sync check, which must read current again
        if: matrix.part == 'reset'
        run: python -m kpi_store.sync_check
      - name: reset of the four stores, with --yes
        if: matrix.part == 'reset'
        run: python -m kpi_store.runner --reset --yes

      # The runbook's sign-in command, databricks auth login --host ... --profile DEFAULT, needs a person in a
      # browser, so no job can run it to its end. This checks that the program knows the command and both options.
      - name: the sign-in command of the runbook and its two options
        if: matrix.part == 'reset'
        run: |
          "$LOCAL/databricks-cli/databricks.exe" auth login --help > "$LOCAL/auth-login-help.txt"
          grep -q -- "--host " "$LOCAL/auth-login-help.txt" || { echo "databricks auth login has no --host option"; exit 1; }
          grep -q -- "--profile " "$LOCAL/auth-login-help.txt" || { echo "databricks auth login has no --profile option"; exit 1; }
          echo "databricks auth login knows --host and --profile"

      # ---- every part: leave nothing behind ----
      # Drops exactly the two schemas this part named and made, and deletes its one workspace folder. CASCADE is right
      # here: both schemas are this run's own. Then the sign-in file goes.
      - name: remove this part's two schemas and its folder from the rehearsal workspace
        if: always()
        run: |
          [ -f "$LOCAL/kpi_store.toml" ] && [ -f "$LOCAL/stores.toml" ] || { echo "no settings were written, so nothing was made"; exit 0; }
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          from databricks.sdk.errors import NotFound
          from kpi_store import settings, sync_check
          local = Path(os.environ["LOCAL"])
          here = settings.load(local / "kpi_store.toml")
          client = sync_check.workspace_client("DEFAULT")
          run_sql = sync_check.statement_runner(client, here.warehouse_id)
          for schema in (here.write_schema, here.tech_graph_schema):
              assert here.write_catalog == os.environ["CI_CATALOG"] and schema.startswith(os.environ["CI_SCHEMA"]) \
                  and schema.startswith("kpi_store_ci_"), "not a schema of this run"
              run_sql(f"DROP SCHEMA IF EXISTS {here.write_catalog}.{schema} CASCADE")
              print("dropped", f"{here.write_catalog}.{schema}")
          # The folder's name comes from the local settings and goes to the SDK. It is not read from this step's
          # environment or given to a command of this shell: Git Bash rewrites a value that starts with / into a
          # Windows path before a Windows program gets it, and the delete then names no folder of the workspace.
          folder = tomllib.loads((local / "stores.toml").read_text(encoding="utf-8"))["databricks"]["workspace_folder"]
          assert folder == "/Workspace/Shared/" + os.environ["CI_SCHEMA"] and os.environ["CI_SCHEMA"].startswith("kpi_store_ci_"), \
              "not the folder of this run"
          try:
              client.workspace.delete(folder, recursive=True)
              print("deleted", folder)
          except NotFound:
              print("the folder", folder, "was not there")
          PY
      - name: remove the sign-in file
        if: always()
        run: python -c "from pathlib import Path; (Path.home() / '.databrickscfg').unlink(missing_ok=True)"
      - name: stop Fuseki
        if: always()
        run: python -m kpi_store.load_fuseki --stop || true
      - name: logs, when a step failed
        if: failure()
        run: |
          for f in "$LOCAL"/runs/fuseki/fuseki.log "$LOCAL"/runs/neo4j/neo4j-load.log "$LOCAL"/neo4j-console.log "$LOCAL"/neo4j-enterprise-2025.06.2/logs/neo4j.log; do
            [ -f "$f" ] && { echo "=== $f"; tail -n 150 "$f"; } || true
          done
          # The check step of a run names its check.log and prints none of it. Each run's log is the check script's
          # output: first the lines that name a failure, then its end. It holds no settings file.
          for f in "$LOCAL"/runs/*/check.log; do
            [ -f "$f" ] || continue
            echo "=== $f, the lines that name a failure"
            grep -n -E "^(FAILED|ERROR) |^FAIL|Traceback|^E  |the checks changed the tree" "$f" | head -n 200 || true
            echo "=== $f, the end"
            tail -n 400 "$f"
          done
          echo "=== what Git reports as changed in the checkout"
          git status --porcelain --untracked-files=all | head -n 50

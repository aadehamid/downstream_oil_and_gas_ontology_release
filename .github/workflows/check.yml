# Runs the release's check script on every pull request, on Linux and on Windows under Git Bash.
name: check
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: python3 on Windows
        if: runner.os == 'Windows'
        run: |
          # Git Bash on the Windows runner has python but no python3; the check script calls python3.
          dir="$(dirname "$(command -v python)")"
          cp "$dir/python.exe" "$dir/python3.exe"
      - name: check.sh
        run: bash scripts/check.sh

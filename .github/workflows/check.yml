# Runs the release's check script on every pull request, on Linux and on Windows under Git Bash.
# The Linux job must pass. The Windows job reports its result but does not block yet: some tests still assume
# POSIX file modes and symbolic links. When those tests pass on Windows, remove continue-on-error below.
name: check
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-2025' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: python3 on Windows
        if: runner.os == 'Windows'
        run: |
          # The check script calls python3. Some Windows images have only python, so make python3 when none exists.
          if ! command -v python3 >/dev/null 2>&1; then
            dir="$(dirname "$(command -v python)")"
            cp "$dir/python.exe" "$dir/python3.exe"
          fi
          command -v python3 && python3 --version
      - name: check.sh
        run: bash scripts/check.sh
      # TEMPORARY while the Windows job is made green: run every check even after one fails, to list all failures.
      - name: survey (temporary)
        if: always() && runner.os == 'Windows'
        run: |
          python3 -c "import locale, sys; print(sys.version); print(locale.getpreferredencoding(False), sys.getfilesystemencoding(), sys.stdout.encoding)"
          git config --show-origin --get-regexp 'core\.(autocrlf|longpaths|symlinks)' || true
          pwd; java -version 2>&1 || true; uv --version; bash --version | head -1
          sed 's/^set -euo pipefail/set -uo pipefail/' scripts/check.sh > scripts/check-survey.sh
          bash scripts/check-survey.sh 2>&1 | tee "$RUNNER_TEMP/survey.log" || true

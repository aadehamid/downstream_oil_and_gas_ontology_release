.notice-open { margin-top: 12px !important; border-color: currentColor; background: var(--surface); color: var(--ink); font-weight: 600; }
.notice-analyst { margin-left: -4px; }
.notice-analyst summary { font-weight: 500; }
.notice-analyst summary:hover { background: none; text-decoration: underline; }
.notice-analyst p { margin: 0 0 0 4px; }

/* ---- The sign-off block: a page one signs ------------------------------------------------------------------------- */
.signoff { margin-top: 40px; padding: 28px 32px 24px; border: 1px solid var(--border); border-radius: var(--radius-card); }
.signoff-intro { max-width: 72ch; margin: 8px 0 0; color: var(--muted); }
.signoff-progress { margin: 10px 0 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.signer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px); column-gap: var(--aside-gap); row-gap: 12px; align-items: end; padding: 22px 0 24px; border-top: 1px solid var(--rule); break-inside: avoid; }
.signer-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.signer-label { color: var(--muted); font-size: var(--fs-body); font-weight: 500; }
.signer-label:empty { display: none; }
.signer-meaning { margin: 8px 0 0; font-family: var(--font-said); font-size: 1.25rem; line-height: 1.4; }
.signer-status { display: inline-block; margin: 8px 0 0; padding: 3px 12px; border: 1px solid var(--border); border-radius: 14px; color: var(--muted); }
.signer-lines { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 16px; }
.consulted-block { margin-top: 8px; padding-top: 24px; border-top: 1px solid var(--border); }
.consulted-block > p { margin: 8px 0 4px; color: var(--muted); }
.consulted-block .signer { align-items: start; }
.consulted-lines { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; }

/* ---- The role table and the explainer ----------------------------------------------------------------------------- */
.block > h2 { font-size: var(--fs-title); letter-spacing: -0.015em; }
.block > p { max-width: 72ch; margin: 10px 0 0; color: var(--muted); }
.table-wrap { margin-top: 20px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 16px 28px 16px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
th { padding-block: 8px; color: var(--muted); font-weight: 500; border-bottom-color: var(--border); }
td:first-child { width: 22%; font-weight: 600; }
td:nth-child(2) { width: 45%; }
td:last-child, th:last-child { padding-right: 0; }
.explainer > h2, .explainer-body { max-width: 68ch; margin-inline: 0; }
.explainer-body { margin-top: 20px; font-size: 1.125rem; line-height: 1.6; }
.explainer-body p { margin: 0 0 14px; }
.explainer ol { margin: 0 0 14px; padding-left: 1.5em; }
.explainer li { margin-bottom: 8px; padding-left: 4px; }

/* ---- A laptop: the notes move between the question and its answer ------------------------------------------------------ */
@media screen and (max-width: 1279px) {
  :root { --pad: 32px; }
  html { scroll-padding-top: calc(2 * var(--control-height) + 20px); }
  .section-head, .question { grid-template-rows: none; grid-template-columns: minmax(0, 1fr); }
  .section-part, .q-side { grid-column: 1; grid-row: auto; }
  .section-part { padding: 6px 0 0; }
  .q-side { padding: 0 0 0 var(--hang); }
  .request .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .signer { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .tabs button { padding: 0 9px; }
  .tabs button[aria-selected="true"]::after { left: 9px; right: 9px; }
  .tabs [data-view="domain-activation"], .tabs [data-view="term-change"], .tabs [data-view="roles"] { margin-left: 17px; }
  .tabs [data-view="domain-activation"]::before, .tabs [data-view="term-change"]::before, .tabs [data-view="roles"]::before { left: -9px; }
}

/* ---- A phone, a narrow window or a zoomed page: the frame folds into a view selector and a Sections button ------------- */
@media screen and (max-width: 999px) {
  :root { --pad: 16px; --hang: 0px; --fs-said: 22px; --fs-title: 26px; --fs-section: 23px; }
  html { scroll-padding-top: 68px; }
  body { padding-bottom: var(--dock-h); }
  .layout { display: flex; flex-direction: column; }
  .side, .stage { display: contents; }
  .brand { order: 1; padding: 12px 16px 4px; }
  .brand-line a { padding: 12px 0; }
  .view-pick { order: 2; display: block; padding: 4px 16px 8px; }
  .view-pick label { display: block; margin-bottom: 4px; color: var(--muted); }
  .view-pick select { font-size: var(--fs-body); font-weight: 600; }
  .tabs { display: none; }
  .sections-toggle { order: 3; position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 6px 16px; border-width: 1px 0; border-color: var(--border); border-radius: 0; background: var(--frame); text-align: left; }
  .sections-toggle:hover { background: var(--frame); }
  .sections-word { flex: none; font-weight: 650; }
  .sections-now { flex: 1 1 auto; min-width: 0; color: var(--muted); font-weight: 400; line-height: 1.3; }
  .sections-toggle .chev { transform: rotate(90deg); }
  .contents { display: none; }
  .layout.sections-open .contents { display: block; position: fixed; inset: 0 0 var(--dock-h) 0; z-index: 5; margin: 0; padding: 12px 12px 24px; overflow-y: auto; background: var(--frame); }
  .sections-close { display: block; margin: 0 4px 10px auto; }
  .contents li:has([data-nav="signoff"]) { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
  .contents a { padding: 10px 12px 12px; }
  .view { order: 4; min-height: 0; padding: 20px var(--pad) 40px; border-width: 0 0 1px; border-radius: 0; }
  .dock { order: 5; inset: auto 0 0 0; z-index: 6; width: auto; gap: 8px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--frame); }
  .actions .primary { flex: 1 1 auto; }
  .request .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  [data-section="7"], .signoff { margin-inline: -8px; padding: 20px 16px; }
  .q-head { display: block; }
  .q-number { display: block; margin-bottom: 4px; }
  .q-rule { margin-left: 0; }
  .consulted-lines { grid-template-columns: minmax(0, 1fr); }
  /* The role table becomes one block for each role. */
  thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  tr { display: block; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  td, td:first-child, td:nth-child(2) { display: block; width: auto; padding: 0; border: 0; }
  td + td { margin-top: 6px; }
  td:last-child { color: var(--muted); }
  td:last-child::before { content: "In the intake: "; font-weight: 600; }
}
@media screen and (max-width: 599px) {
  .request .grid, .signer-lines { grid-template-columns: minmax(0, 1fr); }
}
/* A narrow and short window, such as a laptop zoomed to 200%: the bar keeps only its buttons. */
@media screen and (max-width: 999px) and (max-height: 520px) {
  .draft-note { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---- Print, or save as PDF: the form alone, always light, with every answer in full ------------------------------------- */
@media print {
  @page { margin: 15mm; }
  :root, :root[data-theme="dark"] {
    color-scheme: light;
    --frame: #ffffff; --surface: #ffffff; --raised: #f0f3f5; --active: #dde4e7; --border: #c3ccd1; --rule: #d6dde1; --control: #76828b;
    --ink: #14181b; --muted: #47515a; --accent: #1b6c80; --accent-tint: #e2eff2; --accent-line: #8fbcc8;
    --stop-bg: #fff5d9; --stop-line: #94690a; --stop-ink: #5c3803;
    --hang: 40px; --fs-said: 17px; --fs-body: 12.5px; --fs-answer: 13px; --fs-section: 19px; --fs-title: 22px; --control-height: 30px;
  }
  body { background: none; }
  .skip, .tabs, .contents, .dock, .theme-pick, .view-pick, .sections-toggle, .confirm, .notice-open, .chev { display: none; }
  .side { position: static; width: auto; padding: 0 0 12px; }
  .brand { padding: 0; }
  .stage { margin: 0; padding: 0; }
  .view { min-height: 0; padding: 0; border: 0; border-radius: 0; }
  .view > * { max-width: none; }
  .section-head, .question { grid-template-rows: none; grid-template-columns: minmax(0, 1fr); row-gap: 8px; }
  .section-part, .q-side { grid-column: 1; grid-row: auto; }
  .question { padding: 14px 0; break-inside: avoid; animation: none; }
  .section-head { break-inside: avoid; }
  .q-side { padding: 0 0 0 var(--hang); }
  .request .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  [data-section="7"], .signoff { padding: 18px; }
  .signer { grid-template-columns: minmax(0, 1fr) 46%; padding: 14px 0; }
  .signoff { break-before: page; }
  /* A long list prints only what was chosen, and every part that opens prints open. */
  .picker-search, .picker-all, .picker-more, .picker-chosen { display: none; }
  .picker-list { max-height: none; overflow: visible; }
  .picker-list:not(.short) { min-height: var(--control-height); }
  .picker-list:not(.short) li:not(:has(input:checked)) { display: none; }
  .picker-list label { min-height: 0; padding: 5px 8px; }
  summary { min-height: 0; padding: 0; }
  .about, .section-more, .q-example, .q-analyst, .notice-analyst { margin-left: 0; }
  .request-summary { display: none; }
  details::details-content { display: block; height: auto; content-visibility: visible; }
}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to the form</a>
<div class="layout" id="layout">
  <div class="side">
    <header class="brand top">
      <svg class="mark" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2.6c3.9 4.6 7 8.3 7 12.4a7 7 0 0 1-14 0c0-4.1 3.1-7.8 7-12.4z"/><path d="M10 17.6h6M10 14.2h3.4"/></svg>
      <h1>KPI intake form</h1>
      <p class="brand-line">Works offline. Sends nothing. <a id="guide-link" href="#" target="_blank" rel="noopener">How to use this form</a></p>
      <label class="theme-pick"><span>Theme</span>
        <select id="theme" aria-label="Theme"><option value="light">Light theme</option><option value="dark">Dark theme</option><option value="system">System theme</option></select>
      </label>
      <details class="about"><summary><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg>Version</summary><p class="top-release" id="release-line"></p></details>
    </header>
    <div class="view-pick"><label for="view-select">View</label><select id="view-select"></select></div>
    <button type="button" class="sections-toggle" id="sections-toggle" aria-expanded="false" aria-controls="contents"><span class="sections-word">Sections</span><span class="sections-now" id="sections-now"></span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg></button>
    <nav class="contents" id="contents" aria-label="Sections">
      <button type="button" class="sections-close" id="sections-close">Close the section list</button>
      <ol id="contents-list"></ol>
    </nav>
  </div>
  <div class="stage">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <div class="dock" id="dock">
    <ol class="signoff-nav" id="signoff-nav" aria-label="Sign-off"></ol>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="primary" id="save">Save answers to file</button>
      <button type="button" id="load">Load answers file</button>
      <button type="button" class="quiet" id="clear">Clear this form</button>
      <input type="file" id="load-file" accept=".json,application/json" hidden>
    </div>
    <p class="draft-note">Browser draft only. Save a file to share.</p>
  </div>
</div>
<dialog class="confirm" id="clear-dialog" aria-labelledby="clear-title" aria-describedby="clear-text">
  <h2 id="clear-title">Clear this form?</h2>
  <p id="clear-text"></p>
  <div class="confirm-actions">
    <button type="button" id="clear-cancel" autofocus>Cancel</button>
    <button type="button" class="primary" id="clear-confirm">Clear</button>
  </div>
</dialog>

<!-- One tab of the top navigation. -->
<template id="tpl-tab"><button type="button" role="tab" data-view=""></button></template>

<!-- One line of the section list, with the section's progress. -->
<template id="tpl-nav"><li><a href="#" data-nav=""><span class="nav-name"></span><span class="nav-count"></span><progress max="1" value="0"></progress></a></li></template>

<!-- The start of a form: what it is for, and the request's own fields in a part that closes once they are filled. -->
<template id="tpl-intro">
  <section class="intro" data-part="intro">
    <h2 class="intro-title"></h2>
    <p class="intro-text"></p>
    <p class="intro-follow">Follow-up questions appear when an answer needs them.</p>
    <p class="notice" data-part="example-mark" hidden></p>
    <details class="request" data-part="request-details">
      <summary><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg><span class="request-word">Request details</span><span class="request-summary" data-part="request-summary"></span></summary>
      <div class="grid" data-part="request"></div>
      <div class="field"><label for="comment">Comment</label><textarea id="comment" data-field="comment"></textarea></div>
    </details>
  </section>
</template>

<!-- One section of a form: its name, its progress and who takes part; what it is for and when it is done open on request. -->
<template id="tpl-section">
  <section class="section" data-section="">
    <header class="section-head">
      <div class="section-lead">
        <h2 class="section-title"></h2>
        <p class="section-progress"></p>
      </div>
      <dl class="section-facts section-part">
        <dt>Who takes part</dt><dd class="section-who"></dd>
      </dl>
      <details class="section-more">
        <summary><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg>About this section</summary>
        <p class="section-about"></p>
        <dl class="section-facts">
          <dt>Done when</dt><dd class="section-done"></dd>
        </dl>
      </details>
    </header>
    <p class="section-warning" hidden></p>
    <p class="kind" data-part="kind" hidden></p>
    <div class="questions"></div>
    <p class="section-skipped" hidden></p>
  </section>
</template>

<!-- One question, in reading order: the question as asked aloud and who answers it; why we ask and an example; the
     answer. On a wide window the second part stands beside the other two. -->
<template id="tpl-question">
  <article class="question" data-question="">
    <div class="q-ask">
      <header class="q-head"><span class="q-number"></span><h3 class="q-text"></h3></header>
      <p class="q-meta"><span class="q-who"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6.6" r="3.3"/><path d="M3.6 17.4c.6-3.3 3.2-5.2 6.4-5.2s5.800 1.900 6.400 5.200"/></svg><span><span class="q-who-label">Who answers: </span><span class="q-asked"></span><span class="q-asked-more"></span></span></span><span class="q-rule"></span></p>
    </div>
    <div class="q-side">
      <p class="q-why"><span class="q-why-label">Why we ask</span><span class="q-why-text"></span></p>
      <details class="q-example" hidden><summary><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg>Show example answer</summary><p></p></details>
    </div>
    <div class="q-answer">
      <details class="q-analyst" hidden><summary><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg>For the analyst</summary><p class="q-note" hidden></p></details>
      <div class="q-input"></div>
      <p class="hint q-help" hidden></p>
      <div class="q-detail" hidden><label class="q-detail-label"></label><span class="q-detail-need" hidden>Required</span></div>
      <div class="q-notices"></div>
    </div>
  </article>
</template>

<!-- A pick list: the chosen items, a search box for a long list, and the options. -->
<template id="tpl-picker">
  <div class="picker">
    <ul class="picker-chosen"></ul>
    <label class="picker-all" hidden><input type="checkbox" data-part="show-all"> Show every process, not only this business area's</label>
    <input type="search" class="picker-search" placeholder="Type to search the list" aria-label="Search the list" hidden>
    <ul class="picker-list"></ul>
    <p class="picker-more" hidden></p>
  </div>
</template>
<template id="tpl-option"><li><label><input><span><span class="option-label"></span><span class="option-about"></span></span></label></li></template>
<template id="tpl-chosen"><li><span class="chosen-label"></span><button type="button" aria-label="Remove">Remove</button></li></template>

<!-- A notice under a question: where an answer routes the request, or what a check found. It says what is needed, who
     does it, and gives a button to the form that does it. The first mark shows on a notice that sends the request on its
     way; the second on one that stops the form until something else is done. -->
<template id="tpl-notice">
  <div class="notice" data-notice="">
    <svg class="mark-routes" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 18v-5.5a4 4 0 0 1 4-4h10"/><path d="M14 4.5l4 4-4 4"/></svg><svg class="mark-stops" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M7.4 11h7.2"/></svg>
    <div class="notice-body">
      <p class="notice-title"></p>
      <p class="notice-text"></p>
      <p class="notice-who" hidden></p>
      <ul class="notice-reviewers" aria-label="Reviewers" hidden></ul>
      <button type="button" class="notice-open" hidden></button>
      <details class="notice-analyst" hidden><summary><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg>For the analyst</summary><p></p></details>
    </div>
  </div>
</template>

<!-- The sign-off block. -->
<template id="tpl-signoff">
  <section class="section signoff" data-part="signoff">
    <h2>Sign-off</h2>
    <p class="signoff-intro"></p>
    <p class="signoff-progress" data-part="signoff-progress"></p>
    <div data-part="signers"></div>
    <div class="consulted-block" data-part="consulted-block">
      <h3>Consulted</h3>
      <p>Two groups are consulted and do not sign. Record the date and the outcome of each.</p>
      <div data-part="consulted"></div>
    </div>
  </section>
</template>
<!-- One signer: the role, what the signature is for and the statement on the left, the name and the date on the right.
     Each label stays just before its input in the markup: the script pairs them that way. -->
<template id="tpl-signer">
  <div class="signer" data-signer="">
    <div class="signer-what">
      <h3 class="signer-head"><span class="signer-role"></span><span class="signer-label"></span></h3>
      <p class="signer-meaning"></p>
      <p class="hint signer-required"></p>
      <p class="signer-status" hidden></p>
    </div>
    <div class="grid signer-lines">
      <div class="field"><label>Name</label><input type="text" data-sign="name" autocomplete="off"></div>
      <div class="field"><label>Date</label><input type="date" data-sign="date"></div>
    </div>
  </div>
</template>
<template id="tpl-consulted">
  <div class="signer" data-consulted="">
    <div class="signer-what">
      <h3 class="signer-role"></h3>
      <p class="hint signer-required"></p>
    </div>
    <div class="grid consulted-lines">
      <div class="field"><label>Date</label><input type="date" data-consult="date"></div>
      <div class="field"><label>Outcome</label><input type="text" data-consult="outcome" autocomplete="off"></div>
    </div>
  </div>
</template>

<!-- The role table and the explainer. -->
<template id="tpl-roles">
  <section class="block" data-part="roles">
    <h2>The roles</h2>
    <p>Each definition is the organization's own. The last column says what the role does in the intake.</p>
    <div class="table-wrap"><table><thead><tr><th>Role</th><th>Definition</th><th>In the intake</th></tr></thead><tbody></tbody></table></div>
  </section>
</template>
<template id="tpl-explainer"><section class="block explainer" data-part="explainer"><h2></h2><div class="explainer-body"></div></section></template>

<script id="intake-data" type="application/json">{"release":"KPI Store 1.1","catalogue_version":"1.2","built_from":{"core":"2.4.0","data-product":"1.2.0","integration":"2.5.0","kpi":"1.3.0","lane":"1.1.0","logical-model":"1.0.0","market-data":"1.1.0","organization":"2.2.0","party":"2.1.0","ref-mpc":"1.3.0","system":"1.5.0","technical-graph":"1.1.0","value-stream":"1.2.0"},"forms":{"kpi-intake":"KPI intake","domain-activation":"Domain activation","process-map-request":"Process map request","term-change":"Term change","reference-item":"Reference item"},"roles":[{"id":"global-process-owner","title":"Global Process Owner (or a named delegate)","short":"Global Process Owner","definition":"Global Process Owners own and govern end-to-end business processes, holding single accountability across the process. They sit in the executive layer, setting direction, priorities, and sponsoring success.","in_intake":"Says which business area, process and step the KPI is about, and signs a process map request."},{"id":"domain-owner","title":"Domain Owner","short":"Domain Owner","definition":"Domain Owners are senior business leaders accountable for the effectiveness of their domain. They set the direction and priorities to ensure trusted, valuable, and compliant data enables business outcomes.","in_intake":"Confirms that a KPI belongs to the domain. Signs a domain activation, and signs any KPI where two definitions conflict."},{"id":"data-owner","title":"Data Owner","short":"Data Owner","definition":"Data Owners are accountable for a specific subset of the domains data. Approves definitions, access, and quality targets.","in_intake":"Says what the KPI means and what it connects to, and signs the KPI's definition."},{"id":"data-product-owner","title":"Data Product Owner","short":"Data Product Owner","definition":"Data Product Owners define, build, and govern data products that deliver trusted, discoverable, and valuable data to consumers. They own the product vision, requirements, quality, contracts, and lifecycle from design to adoption.","in_intake":"Says which data product serves the KPI."},{"id":"data-steward","title":"Data Steward","short":"Data Steward","definition":"Data Stewards operationalize data governance within their domain by managing business meaning, metadata quality, data quality, compliance, and issue resolution to ensure trusted data and data products.","in_intake":"Gives the facts about the KPI and its other names."},{"id":"digital-it","title":"Digital IT","short":"Digital IT","definition":"The Digital IT team designs, builds, and operates enterprise platforms, applications, and data solutions","in_intake":"Says where the data lives, in section 7."},{"id":"enterprise-data-governance","title":"Enterprise Data Governance","short":"Enterprise Data Governance","definition":"Enterprise Data Governance sets the vision, policies, standards, and operating model for data governance across the organization. It enables consistency, compliance, quality, and interoperability so data can be trusted, shared, and used to drive business outcomes. (and promote data as an asset)","in_intake":"Is consulted when the check finds the KPI's name in another module of the ontology."},{"id":"business-analyst","title":"Business analyst","short":"Business analyst","definition":"Delivery role","in_intake":"Interviews, fills the form and drafts the texts the others confirm."},{"id":"program-manager","title":"Program manager","short":"Program manager","definition":"Delivery role","in_intake":"Owns the request, decides who attends and proposes which domain to ask."},{"id":"architect","title":"Architect (sits in Digital IT)","short":"Architect","definition":"Delivery role","in_intake":"Reviews the form, runs the completeness check and signs the change."},{"id":"ontology-owner","title":"Ontology Owner","short":"Ontology Owner","definition":"The person the organization names to decide what the ontology means.","in_intake":"Signs a term change that is major: one where a report or an answer that used the old meaning may now be wrong."}],"sections":[{"id":"1","form":"kpi-intake","name":"The business area","technical_name":"domain identification","audience":"business","about":"Here we find the business area and the domain of the KPI, and the process and step where people use it. The business area is the function that runs the process, such as Commercial or Marketing. The domain is the data domain the KPI belongs to, such as Market Price, and it has a Domain Owner. We do this first because the ontology hangs every KPI on a process it already knows, and because every KPI belongs to one domain. If the process or the step is missing, the request goes to the process map first. If the domain is not active, it is activated first.","who":"The Global Process Owner, or a named delegate, picks the area, the process and the step. The Program manager proposes the domain, and that domain's Domain Owner confirms that the KPI is in its scope. The Domain Owner need not sit in the rest of the interview. The Business analyst shows the lists and records the answers.","done_when":"The form names one business area, one process, one step and one active domain from the lists, or the request has moved to a process map request or to domain activation.","typical":"5 to 6","minutes":"8"},{"id":"2","form":"kpi-intake","name":"What the KPI means","technical_name":"the controlled vocabulary","audience":"business","about":"Here we agree on one name and one meaning for the KPI. Every later fact is attached to this meaning. If two teams mean different things by the same name, the KPI would count the wrong thing, and people would have to correct every report that used it.","who":"The Data Owner gives the definition and later signs it. The Business analyst drafts the wording.","done_when":"The KPI has one name, a definition of one or two sentences that does not repeat the name, a statement of what it counts and what it leaves out, and the business objective it helps to track. The completeness check has compared the name with the terms the ontology already holds.","typical":"5","minutes":"13"},{"id":"3","form":"kpi-intake","name":"The facts about it","technical_name":"the metadata","audience":"business","about":"Here we record a fixed set of facts about the KPI: how it is worked out, its unit, how often and at what level it is stated, what it is compared with, and where its definition is written. We also record its status, what makes it trustworthy, when it is reviewed, and any thresholds. With these facts, a reader can check a definition, tell which document it came from, and know whether to rely on the number yet.","who":"The Data Steward answers.","done_when":"The form says in words how the KPI is worked out, with its unit and its grain, names a written source with a date, and gives the KPI's status. A KPI with no written source cannot go forward.","typical":"12 to 13","minutes":"17"},{"id":"4","form":"kpi-intake","name":"Where it belongs","technical_name":"the taxonomy (the measure list is flat, so the taxonomy is the measure's kind)","audience":"business","about":"Here we sort the KPI into one of eight kinds of measure. The kind tells readers how to treat the number. A market price nobody controls, a comparison with a plan and a KPI with a target and an owner are read in different ways. We ask up to five yes or no questions in order and stop at the first one that decides.","who":"The Data Owner answers. The Business analyst asks the questions in order and writes the reason.","done_when":"One question has decided the kind, and the reason is written in one or two sentences. If the kind is KPI, the form names the document that records the target and the accountable owner.","typical":"4 to 6","minutes":"6"},{"id":"5","form":"kpi-intake","name":"Other names for it","technical_name":"the thesaurus (question 5.2 feeds a typed property, because the ontology has no skos:related link)","audience":"business","about":"Here we collect the other words people use for the KPI, and the nearby measures people mistake it for. With the other names, a person who searches with their own word finds the KPI. With the \"not this\" list, an AI assistant or a report does not answer with the wrong number.","who":"The Data Steward answers.","done_when":"The form lists every other name the attendees know, and gives one sentence of difference for each measure the KPI is mistaken for.","typical":"4","minutes":"6"},{"id":"6","form":"kpi-intake","name":"What it connects to","technical_name":"the ontology (the typed links to roles, processes, value stream steps and data products)","audience":"business","about":"Here we link the KPI to the roles that use it, to its named owner and steward, to the other places in the business where it is used, and to the data product that gives it. These links let a person ask \"who uses this number, who answers for it, and where does it come from\" and get one answer.","who":"The Data Owner answers. The Data Product Owner names the data product in 6.6.","done_when":"The form names at least one role that uses the KPI, and its owner and its steward. Each value stream step it names has a relationship and a written basis. The form names the data product, or says that none exists yet.","typical":"6 to 8","minutes":"14"},{"id":"7","form":"kpi-intake","name":"Where the data lives (IT only)","technical_name":"the knowledge graph","audience":"it","about":"Here Digital IT names the view or table that gives the KPI's values, and what that view is built from. The business does not take part. IT fills this section after the business has signed sections 1 to 6. The Databricks discovery fills in what it can find first.","who":"Digital IT answers. The Data Product Owner confirms 7.1 if the view is new. The Architect checks that every name exists in the workspace.","done_when":"The form names one view or table that exists in the workspace under that exact name, or says that the KPI has no data yet. The first is not required. A KPI can be defined before anyone builds it.","warning":"The load compares the ontology with the workspace. An object, a column or a table link that the ontology names and the workspace lacks stops the load. Name only what exists.","typical":"4 to 10","minutes":"20 to 30"},{"id":"D","form":"domain-activation","name":"Domain activation","technical_name":"a data domain that is not active yet","audience":"business","about":"Use this form when the answer to question 1.5 of the KPI form is a domain that is not active, or \"not in the list\". A domain is a data domain, such as Customer or Market Price: a body of data with one Domain Owner. The form collects what the organization needs to make the domain active: what data it covers, who owns it, and what it serves. When the Domain Owner and the Architect have signed, the domain is set to active in settings.toml, and the KPI form can go on.","who":"The Domain Owner answers and signs. The Program manager owns the request. The Business analyst fills the form.","done_when":"The domain has a name, a statement of the data it covers, a Domain Owner, its Data Owners and Data Stewards, the business areas it serves, at least one first KPI and a written basis with a date. The Domain Owner has signed the activation, and the Architect has signed the change.","typical":"10","minutes":"60"},{"id":"P","form":"process-map-request","name":"Process map request","technical_name":"a business area, process, step or role that the process map lacks","audience":"business","about":"Use this form when a question of the KPI form ends in \"not in the list\" for the business area, the process, the step or a role. It is smaller than a domain activation and it is not one. It collects what the Architect needs to propose the change to the process map. The Architect then does the modelling and releases it.","who":"The Global Process Owner, or a named delegate, answers and signs. The Program manager owns the request. The Business analyst fills the form.","done_when":"The form names what is missing, where it sits in the process map, and a document that describes it. The Global Process Owner and the Architect have signed.","typical":"4 to 7","minutes":"30"},{"id":"T","form":"term-change","name":"Term change","technical_name":"a change to a measure the ontology already holds","audience":"business","about":"Use this form to change a measure the ontology already holds: its name, its definition, its other names, or the processes it is linked to. A new KPI goes through the KPI form instead. When the form is complete and signed, the Architect turns it into a proposal with one command and applies the proposal with another. Nobody edits a file of the ontology by hand.","who":"The Data Owner answers and signs. The Architect checks the form and signs last. When the answer to T8 is \"no\" or \"not sure\", the Ontology Owner signs too. The Business analyst fills the form.","done_when":"The form names one measure and asks for at least one change. T8 is answered. The Data Owner and the Architect have signed, and the Ontology Owner too when the change is major.","typical":"3 to 8","minutes":"15"},{"id":"R","form":"reference-item","name":"Reference item","technical_name":"a new system or a new table in a module that the ontology already holds","audience":"business","about":"Use this form to add a reference item to the ontology: a system that a document names, or a table in Databricks that copies a table of a system. The form asks only what the ontology needs: the item's name, what it is, and what it links to, picked from the ontology's own lists. A new source document, a role, a data product and a table built from other tables need a specialist, and the form says why. When the form is complete and signed, the Architect turns it into a proposal with one command and applies the proposal with another. Nobody edits a file of the ontology by hand.","who":"The Data Owner answers and signs. Digital IT names a table's system and its record. The Architect checks the form and signs last. The Business analyst fills the form.","done_when":"The form names one new item of a kind the form adds, with every answer its kind needs. The Data Owner and the Architect have signed.","typical":"4 to 7","minutes":"10"}],"questions":[{"id":"1.1","section":"1","text":"Which part of the business does this KPI belong to?","type":"choice","source":"business-areas","required":"required","why":"The area decides which processes and roles the next questions offer.","option":[{"id":"@not-in-list","label":"Not in the list"}],"route":[{"when":"@not-in-list","outcome":"process-map-request","notice":"The ontology does not hold this business area. The KPI cannot be added until the area is in the process map. Stop here and fill in the process map request."}],"detail":{"label":"What is the missing area called?","type":"text","required_when":"@not-in-list"},"asked_of_text":"Global Process Owner","requirement":"Required","example":"Crack Spreads Pricing: Commercial"},{"id":"1.2","section":"1","text":"Which process in that area is this KPI about?","type":"choice","source":"processes","levels":[1,3],"narrow_by":"1.1","required":"required","why":"A KPI says something about work. We need the work it describes.","option":[{"id":"@not-in-list","label":"Not in the list"}],"route":[{"when":"@not-in-list","outcome":"process-map-request","notice":"The ontology does not hold this process. The KPI cannot be added until the process is in the process map. Stop here and fill in the process map request."}],"detail":{"label":"What is the missing process called?","type":"text","required_when":"@not-in-list"},"asked_of_text":"Global Process Owner","requirement":"Required","example":"Crack Spreads Pricing: CM 1.1.4.7 Refinery Optimization"},{"id":"1.3","section":"1","text":"At which step of that process do people use the number?","type":"choice","source":"processes","levels":[4,6],"under":"1.2","required":"optional","why":"The step is the most exact place we can attach the KPI to.","option":[{"id":"@not-in-list","label":"The step is missing"}],"route":[{"when":"@not-in-list","outcome":"process-map-request","notice":"The ontology does not hold this step. Fill in the process map request for the missing step."}],"detail":{"label":"What is the missing step called?","type":"text","required_when":"@not-in-list"},"asked_of_text":"Global Process Owner","requirement":"Optional","example":"Crack Spreads Pricing: CM 1.1.4.7.4 Capture Product/Crude/Feedstock Price"},{"id":"1.4","section":"1","text":"What do people decide or do with the number at that step?","type":"long_text","required":"required","why":"It checks that we chose the right step, and it shows whether this is a KPI or a report.","asked_of_text":"Global Process Owner","requirement":"Required","example":"Crack Spreads Pricing: Illustration: Planners read the crack spread to judge the market margin before they set the refinery plan."},{"id":"1.5","section":"1","text":"Which domain does this KPI belong to?","note":"The domain list that ships with this release is an example. Replace it with your organization's domains in settings.toml.","asked_of_text":"The Domain Owner of the proposed domain. The Program manager proposes which domain to ask","type":"choice","source":"settings:domains","required":"required","why":"Every KPI belongs to exactly one domain, and that domain's owner must agree that it does.","option":[{"id":"@not-in-list","label":"Not in the list"}],"route":[{"when":"@inactive","outcome":"domain-activation","notice":"This domain is not active yet. The KPI cannot be added until the domain is activated."},{"when":"@not-in-list","outcome":"domain-activation","notice":"The organization has no such domain yet. The KPI cannot be added until the domain is activated."}],"detail":{"label":"What is the missing domain called?","type":"text","required_when":"@not-in-list"},"requirement":"Required","example":"Crack Spreads Pricing: Market Price"},{"id":"1.6","section":"1","text":"Which other domains' data does it use?","type":"multi_choice","source":"settings:domains","required":"optional","why":"A KPI often reads data that another domain owns, and that domain's people must know.","asked_of_text":"Data Owner","requirement":"Optional","example":"The filled examples name no other domain. An answer would be \"Refinery Production\"."},{"id":"2.1","section":"2","text":"What do you call this KPI?","type":"text","required":"required","why":"One preferred name stops two teams from using two names for one thing.","asked_of_text":"Data Owner","requirement":"Required","example":"Crack Spreads Pricing: Crack Spreads Pricing"},{"id":"2.2","section":"2","text":"In one or two sentences, what does it measure? Please do not use the KPI's own name.","type":"long_text","required":"required","why":"The definition is what every report and every answer will repeat.","asked_of_text":"Data Owner","requirement":"Required","example":"Crack Spreads Pricing: Benchmark crack spreads: the market value of products made from a set ratio of crude, less the crude's price."},{"id":"2.3","section":"2","text":"What does it count?","type":"long_text","required":"optional","why":"Two people can agree on a name and still count different things.","asked_of_text":"Data Owner","requirement":"Optional","example":"Crack Spreads Pricing: The crude and product benchmarks of each series' recipe (the market-data module's series)."},{"id":"2.4","section":"2","text":"What does it leave out?","type":"long_text","required":"optional","why":"What is left out is where most disputes about a number start.","asked_of_text":"Data Owner","requirement":"Optional","example":"Crack Spreads Pricing: The market cost of RINs, in MPC's 10-K regional and blended crack spreads."},{"id":"2.5","section":"2","text":"Which business objective does this KPI help you track? Write \"None stated\" if no objective has been agreed.","type":"long_text","required":"required","why":"The objective tells every reader why the business watches this number.","asked_of_text":"Data Owner","requirement":"Required","example":"Crack Spreads Pricing: Illustration: Capture the market margin: plan refinery runs and product placement against the benchmark crack spreads."},{"id":"3.1","section":"3","text":"How is it worked out, in words? What is divided by what, or taken from what?","type":"long_text","required":"required","ask_when":[{"question":"4.1","is_not":"no"}],"why":"The ontology describes the calculation in words. It never calculates.","asked_of_text":"Data Steward","requirement":"Required if 4.1 is not \"no\"","example":"Crack Spreads Pricing: products price - crude price, for a stated crude:product ratio (for example 3-2-1)"},{"id":"3.2","section":"3","text":"What unit is it stated in?","type":"text","required":"required","ask_when":[{"question":"4.1","is_not":"no"}],"why":"A number with no unit cannot be compared with another.","asked_of_text":"Data Steward","requirement":"Required if 4.1 is not \"no\"","example":"Crack Spreads Pricing: Illustration: US dollars per barrel"},{"id":"3.3","section":"3","text":"How often do people receive this KPI, and which breakdowns do they need in the report?","type":"text","required":"required","ask_when":[{"question":"4.1","is_not":"no"}],"help":"Illustration: 3.3 is \"Monthly, by refinery\". 3.8 is \"One value for each day, refinery and product\".","why":"A daily figure by market hub and a monthly figure by refining region are different things to build and to read.","asked_of_text":"Data Steward","requirement":"Required if 4.1 is not \"no\"","example":"Crack Spreads Pricing: daily, by market hub"},{"id":"3.4","section":"3","text":"What do you compare it against?","type":"text","required":"optional","why":"A plan, a forecast or history tells the reader what a good value is.","asked_of_text":"Data Steward","requirement":"Optional","example":"Crack Spreads Pricing: 30-day trend; 5-year history"},{"id":"3.5","section":"3","text":"Where is this definition written down? Choose the document, then give its date and the page or section.","type":"multi_choice","source":"sources","required":"required","why":"Every definition must be traceable to a document someone can open.","option":[{"id":"@new-document","label":"A document that is not in the list"}],"route":[{"when":"@new-document","outcome":"note","notice":"This is a new source document. The Architect gives it an evidence tier before the KPI is added."}],"detail":{"label":"The document, its date and the page or section","type":"text","required_when":"always"},"asked_of_text":"Data Steward","requirement":"Required","example":"Crack Spreads Pricing:\nValue Chain Optimization Decision Support and Visualization: the planning team's measure list\nMPC-S01 Item 7 pp. 46, 51; KI-27; KI-28"},{"id":"3.6","section":"3","text":"Does it already have an ID or a code in a report, a dashboard or a system? Write it, or write \"no\".","type":"long_text","required":"optional","why":"We keep the old code, so that people who know the KPI by it can find it.","asked_of_text":"Data Steward","requirement":"Optional","example":"Crack Spreads Pricing: KPI-0001 is the crack-spread Genie agent's identifier for this measure. The gold table behind its metric view holds the constant KPI_ID value 'KPI Crack Spread 3-2-1' on every one of its 127 series and all 1,090,423 rows of the gold table alike, so the identifier names the measure, not a series (the decision of 2026-10-25, item 3). It keeps KPI-0001 although the module classes it as a market indicator, because the pricing assets already use it (kpi 1.3.0, the decision of 2026-10-28)."},{"id":"3.7","section":"3","text":"Who may see this KPI: anyone in the company, or only a restricted group?","type":"choice","source":"settings:visibility","required":"required","why":"Only a restricted KPI needs those reviews, so we ask everyone this one question.","route":[{"when":"restricted","outcome":"restricted-review","notice":"A restricted KPI needs Privacy, Security, Compliance and Risk in the request before sign-off. Record the date and the outcome of their review in the sign-off block."}],"asked_of_text":"Data Steward","requirement":"Required","example":"Crack Spreads Pricing: Anyone in the company"},{"id":"3.8","section":"3","text":"What does one individual KPI value describe? Name its time period and the item or combination of items it covers.","help":"This is the KPI's grain. Illustration: 3.3 is \"Monthly, by refinery\". 3.8 is \"One value for each day, refinery and product\".","type":"text","required":"required","ask_when":[{"question":"4.1","is_not":"no"}],"why":"This tells builders which values can be compared or combined.","asked_of_text":"Data Steward","requirement":"Required if 4.1 is not \"no\"","example":"Crack Spreads Pricing: Illustration: One value for each day and each Price Master record. It rolls up by price group, price sheet and price batch."},{"id":"3.9","section":"3","text":"What status has the Data Owner confirmed? Leave \"Draft\" selected until certification is confirmed.","help":"The form does not change this status when someone signs.","type":"choice","source":"settings:status","default":"draft","required":"required","why":"Readers must know whether they can rely on the KPI yet.","asked_of_text":"Data Steward","requirement":"Required","example":"Crack Spreads Pricing: Draft"},{"id":"3.10","section":"3","text":"What agreed data checks must pass before this KPI is used? Say what happens if a check fails.","help":"Record the agreed rule. If none is agreed, leave this blank.","type":"long_text","required":"optional","why":"These checks tell readers whether the data is fit to use.","asked_of_text":"Data Steward","requirement":"Optional","example":"Crack Spreads Pricing: Illustration: Active records only. Soft-deleted rows are excluded. If the check fails, the day's values are held back."},{"id":"3.11","section":"3","text":"When should the Data Owner review this KPI? What agreed change would mean it should stop being used?","help":"Record the agreed rule. If none is agreed, leave this blank.","type":"long_text","required":"optional","why":"A KPI that nobody reviews is still reported after it has stopped meaning anything.","asked_of_text":"Data Steward","requirement":"Optional","example":"Crack Spreads Pricing: Illustration: Once a year. It stops being used when the benchmark it is built from is no longer published."},{"id":"3.12","section":"3","text":"What agreed limits call for attention or action? For each, give the condition, value, unit and action. Leave blank if none are agreed.","help":"Illustration, not a real limit: \"Crude utilization below 90 percent: tell the Economics and Planning Manager.\"","type":"list","required":"optional","why":"A threshold tells the reader when the number needs attention.","asked_of_text":"Data Steward","requirement":"Optional","example":"R\u0026M Margin per Barrel: Illustration: Realized margin per barrel below the month's forecast, in US dollars per barrel: review it with Business Planning and Analysis."},{"id":"3.13","section":"3","text":"When does each threshold start? Give its end date, or write \"No end date\". Use YYYY-MM-DD.","help":"If all thresholds share the same dates, state that once.","type":"text","required":"required","ask_when":[{"question":"3.12","answered":true}],"why":"A threshold changes over time, and a reader must know which one was in force.","asked_of_text":"Data Steward","requirement":"Required if 3.12 has an answer","example":"R\u0026M Margin per Barrel: Illustration: Starts 2026-01-01. No end date."},{"id":"4.1","section":"4","text":"Is it a number with a way to work it out, a unit and a time period?","type":"choice","source":"choices:yes-no","required":"required","why":"A list, a status or a schedule is a report. We record it, but not as a measure.","asked_of_text":"Data Owner","requirement":"Required","example":"Crack Spreads Pricing: Yes"},{"id":"4.2","section":"4","text":"Does it appear only when something happens, like a warning?","type":"choice","source":"choices:yes-no","required":"required","ask_when":[{"question":"4.1","is":"yes"}],"why":"An alert is an event, not a series of values.","asked_of_text":"Data Owner","requirement":"Required if 4.1 is \"yes\"","example":"Crack Spreads Pricing: No"},{"id":"4.3","section":"4","text":"Is its value set by an outside market or a published benchmark that the business cannot influence?","type":"choice","source":"choices:yes-no","required":"required","ask_when":[{"question":"4.2","is":"no"}],"why":"Nobody can be held to a target on a number they cannot move.","asked_of_text":"Data Owner","requirement":"Required if 4.2 is \"no\"","example":"Crack Spreads Pricing: Yes"},{"id":"4.4","section":"4","text":"Is it worked out from market prices and the planning model, to start or to rank a decision, with no target?","type":"choice","source":"choices:yes-no","required":"required","ask_when":[{"question":"4.3","is":"no"}],"why":"Some numbers exist to trigger a decision and are not a score of performance.","asked_of_text":"Data Owner","requirement":"Required if 4.3 is \"no\"","example":"R\u0026M Margin per Barrel: No"},{"id":"4.5","section":"4","text":"Does it compare actual results, or a plan, with a plan, a forecast, an earlier plan or history, for one period?","type":"choice","source":"choices:yes-no","required":"required","ask_when":[{"question":"4.4","is":"no"}],"why":"A comparison with a plan explains a gap. It is a diagnostic.","asked_of_text":"Data Owner","requirement":"Required if 4.4 is \"no\"","example":"R\u0026M Margin per Barrel: No"},{"id":"4.6","section":"4","text":"Has the business formally chosen this measure to track that objective, with a target and an accountable owner?","help":"Record the objective in 2.5 and the owner in 6.8. Here, name the document recording the decision.","type":"choice","source":"choices:yes-no","required":"required","ask_when":[{"question":"4.5","is":"no"}],"why":"A measure becomes a KPI by a recorded decision, not by its formula.","detail":{"label":"The document that records the decision","type":"text","required_when":"yes"},"asked_of_text":"Data Owner","requirement":"Required if 4.5 is \"no\"","example":"R\u0026M Margin per Barrel: No"},{"id":"4.7","section":"4","text":"If it is not a KPI today, is it a strong candidate to become one?","type":"choice","source":"choices:yes-no","required":"required","ask_when":[{"question":"4.6","is":"no"}],"why":"It marks the measures the business may promote later.","asked_of_text":"Data Owner","requirement":"Required if 4.6 is \"no\"","example":"R\u0026M Margin per Barrel: Yes"},{"id":"4.8","section":"4","text":"In one or two sentences, why does it belong to that kind?","asked_of_text":"Business analyst drafts, Data Owner confirms","type":"long_text","required":"required","why":"The next reader must see why, and not only which kind.","requirement":"Required","example":"Crack Spreads Pricing: MPC files crack spreads under market indicators and calls margins dependent on factors beyond its control. The list's cracks (NYMEX 3-2-1, USGC 3-2-1 MEH ex-RIN, Chicago WTI 3-2-1 ex-RIN) are benchmarks, not performance."},{"id":"4.9","section":"4","text":"Which topic, or family of KPIs, does it belong to, if any?","type":"text","required":"optional","why":"People look for a KPI among others on the same topic.","asked_of_text":"Data Owner","requirement":"Optional","example":"Crack Spreads Pricing: Illustration: Market margin potential"},{"id":"5.1","section":"5","text":"What other names or short forms do people use for it?","type":"list","required":"optional","why":"People search with their own word.","asked_of_text":"Data Steward","requirement":"Optional","example":"Crack Spreads Pricing:\n3-2-1 crack\ncrack spread\nthe crack"},{"id":"5.2","section":"5","text":"Which measures do people mistake it for?","type":"multi_choice","source":"measures","required":"optional","why":"A near neighbour is the most likely wrong answer.","asked_of_text":"Data Steward","requirement":"Optional","example":"Crack Spreads Pricing:\nMargin Capture\nR\u0026M Margin Indicator\nR\u0026M Margin per Barrel"},{"id":"5.3","section":"5","text":"How does it differ from each of those?","type":"long_text","required":"required","ask_when":[{"question":"5.2","answered":true}],"why":"The difference is what the reader needs when they have the wrong one.","asked_of_text":"Data Steward","requirement":"Required if 5.2 has an answer","example":"Crack Spreads Pricing: Not realized refinery margin, not margin capture, and not MPC's R\u0026M Margin Indicator. A 3-2-1 built from separate product and crude legs is not the published series."},{"id":"5.4","section":"5","text":"Does the company publish this number, or one close to it, outside the company? Which one? Write \"none\" if it does not.","type":"text","required":"required","why":"Readers compare an internal figure with the published one. They must know whether the two are the same.","asked_of_text":"Data Steward","requirement":"Required","example":"Crack Spreads Pricing: MPC 10 (Gulf Coast, Mid-Continent, West Coast and blended 3-2-1 cracks)"},{"id":"6.1","section":"6","text":"Which roles use this number?","type":"multi_choice","source":"roles","required":"required","why":"The roles are the audience of every report on this KPI.","option":[{"id":"@not-in-list","label":"A role that is not in the list"}],"route":[{"when":"@not-in-list","outcome":"process-map-request","request_questions":["P5","P6"],"notice":"The ontology does not hold this role. Fill in questions P1, P5, P6 and P7 of the process map request for the missing role."}],"detail":{"label":"What is the missing role called?","type":"text","required_when":"@not-in-list"},"asked_of_text":"Data Owner","requirement":"Required","example":"Crack Spreads Pricing:\nDistribution Planner (planning persona)\nPrompt Planner\nShort-Term Planner"},{"id":"6.2","section":"6","text":"Is the number used in any other process? Choose each one, or leave this empty.","type":"multi_choice","source":"processes","levels":[1,6],"required":"optional","why":"A KPI used in two processes must mean the same in both.","asked_of_text":"Data Owner","requirement":"Optional","example":"R\u0026M Margin per Barrel: CM 1.1.5 Regional Backcasting"},{"id":"6.3","section":"6","text":"Which steps of a value stream use it?","type":"multi_choice","source":"value-stream-steps","required":"optional","why":"The value stream shows where in the flow of work the number matters.","option":[{"id":"@not-in-list","label":"The step is missing"}],"route":[{"when":"@not-in-list","outcome":"process-map-request","notice":"The ontology does not hold this value stream step. Fill in the process map request for the missing step."}],"asked_of_text":"Data Owner","requirement":"Optional","example":"Crack Spreads Pricing:\nMarket Price Calculation \u0026 Validation\nPerformance Tracking \u0026 Analysis"},{"id":"6.4","section":"6","text":"For each of those steps, how does the step use the number: as an input, as an outside reference to compare against, or as a result it tracks?","type":"multi_choice","source":"measure-relationships","per":"6.3","required":"required","ask_when":[{"question":"6.3","answered":true}],"why":"A step that tracks a result answers for it. A step that only reads it does not.","asked_of_text":"Data Owner","requirement":"Required if 6.3 has an answer","example":"Crack Spreads Pricing:\nBenchmarks: The process compares results against the measure as an external reference.\nBenchmarks: The process compares results against the measure as an external reference."},{"id":"6.5","section":"6","text":"For each of those steps, what document tells us so?","type":"list","per":"6.3","required":"required","ask_when":[{"question":"6.3","answered":true}],"why":"Each link needs a written basis, like the definition.","asked_of_text":"Data Owner","requirement":"Required if 6.3 has an answer","example":"Crack Spreads Pricing:\nMPC's market benchmarks are the Gulf Coast, Mid-Continent and West Coast 3-2-1 crack spreads; MPC FY2025 10-K, Item 7 (reference/mpc/mpc-fy2025-10k-fact-sheet.md, section 8)\nMPC states that the sweet and sour crude differentials explain why realized margin differs from the blended crack; MPC FY2025 10-K, Item 7 (reference/mpc/mpc-fy2025-10k-fact-sheet.md, section 8)"},{"id":"6.6","section":"6","text":"Which data product gives this number?","type":"choice","source":"data-products","required":"optional","why":"It tells IT where to look, and it tells readers whom to ask about the data.","option":[{"id":"@none-yet","label":"None yet"},{"id":"@not-in-list","label":"Not in the list"}],"route":[{"when":"@not-in-list","outcome":"note","notice":"This is a new data product. Digital IT describes it in section 7."}],"detail":{"label":"What is the new data product called?","type":"text","required_when":"@not-in-list"},"asked_of_text":"Data Product Owner","requirement":"Optional","example":"Crack Spreads Pricing: Master Pricing"},{"id":"6.7","section":"6","text":"Is the number published as several named series, such as one for each region or market?","type":"choice","source":"choices:yes-no","required":"required","ask_when":[{"question":"4.3","is":"yes"}],"ask_when_text":"Asked only when the kind is market indicator","why":"Each series has its own recipe, and the form for one KPI does not collect recipes.","route":[{"when":"yes","outcome":"note","notice":"The series need modelling in the market-data module. The Architect does that outside this form."}],"asked_of_text":"Data Owner","requirement":"Asked only when the kind is market indicator","example":"Crack Spreads Pricing: Yes"},{"id":"6.8","section":"6","text":"Who is accountable for this KPI's meaning and the action taken on it? Give their position and business area, or their name.","help":"A position is enough. A person's name stays in the answers file and never goes into the ontology.","type":"text","required":"required","why":"One named owner answers for the KPI: what it means, and what is done when it moves.","asked_of_text":"Data Owner","requirement":"Required","example":"Crack Spreads Pricing: Illustration: Economics and Planning Manager, Commercial"},{"id":"6.9","section":"6","text":"Who maintains this KPI's definition and handles questions about its data? Give their position and business area, or their name.","help":"A position is enough. A person's name stays in the answers file and never goes into the ontology.","type":"text","required":"required","why":"The steward keeps the KPI's facts current and is the first to ask about its data.","asked_of_text":"Data Owner","requirement":"Required","example":"Crack Spreads Pricing: Illustration: Pricing Representative, Commercial"},{"id":"7.1","section":"7","text":"Which view or table gives this KPI's values? Give the full name.","type":"choice","source":"platform-tables","required":"required","why":"An AI assistant may quote a value only through the view the ontology binds to the KPI.","option":[{"id":"@not-in-list","label":"Not in the list"},{"id":"@no-data-yet","label":"No data yet"}],"route":[{"when":"@not-in-list","outcome":"note","notice":"The ontology does not hold this view or table. Answer 7.2 to 7.6 and 7.9, so that the Architect can add it."},{"when":"@no-data-yet","outcome":"note","notice":"The KPI has no data yet. It can be defined before anyone builds it."}],"asked_of_text":"Digital IT","requirement":"Required","example":"Crack Spreads Pricing: idp_sbx.semantic_sem_commercial.mpr_mips_crack_spread_price_fact_metrics_vw"},{"id":"7.2","section":"7","text":"If it is not in the list: what is its full name, and which layer is it in?","type":"choice","source":"layers","required":"required","ask_when":[{"question":"7.1","is":"@not-in-list"}],"why":"The ontology must hold the view before it can bind a KPI to it.","detail":{"label":"Its full name, as catalog.schema.name","type":"text","required_when":"always"},"asked_of_text":"Digital IT","requirement":"Required if 7.1 is \"not in the list\"","example":"Not asked for the filled examples. Their view is in the list, in the metric view layer."},{"id":"7.3","section":"7","text":"Which tables or views is it built from?","type":"multi_choice","source":"platform-tables","required":"required","ask_when":[{"question":"7.1","is":"@not-in-list"}],"why":"The lineage shows what is affected when a table changes.","asked_of_text":"Digital IT","requirement":"Required if 7.1 is \"not in the list\"","example":"Not asked for the filled examples. An answer would be the gold table idp_sbx.gold_commercial_core.mpr_mips_crack_spread_price_fact."},{"id":"7.4","section":"7","text":"Which source systems does its data come from?","type":"multi_choice","source":"systems","required":"required","ask_when":[{"question":"7.1","is":"@not-in-list"}],"why":"It names the systems of record behind the number.","asked_of_text":"Digital IT","requirement":"Required if 7.1 is \"not in the list\"","example":"Not asked for the filled examples. An answer would be MIPS, MPR and KittyHawk."},{"id":"7.5","section":"7","text":"Is it a foundational or a derived data product, and why?","type":"choice","source":"data-product-kinds","required":"required","ask_when":[{"question":"7.1","is":"@not-in-list"},{"question":"7.2","is_not":"https://w3id.org/mpc/ontology/modules/data-product/layer/replica"}],"ask_when_text":"Required if 7.1 is \"not in the list\" and the layer is not replica","why":"A derived product adds business logic, and readers must know that.","detail":{"label":"Why","type":"long_text","required_when":"always"},"asked_of_text":"Digital IT","requirement":"Required if 7.1 is \"not in the list\" and the layer is not replica","example":"Not asked for the filled examples. An answer would be \"Derived. It defines measures (averages, minimum, maximum, range) over the gold crack-spread fact.\""},{"id":"7.6","section":"7","text":"Is it in a sandbox or in production?","type":"choice","source":"choices:environment","required":"required","ask_when":[{"question":"7.1","is":"@not-in-list"}],"why":"A sandbox name will change, and the ontology must follow it.","asked_of_text":"Digital IT","requirement":"Required if 7.1 is \"not in the list\"","example":"Not asked for the filled examples. An answer would be \"Sandbox\"."},{"id":"7.7","section":"7","text":"Which measure or column of the view holds the KPI, and with what filter?","type":"text","required":"optional","why":"One view can hold several measures.","asked_of_text":"Digital IT","requirement":"Optional","example":"The ontology holds no such link yet, so the filled examples leave this empty."},{"id":"7.8","section":"7","text":"Which AI assistant or report answers from this view?","type":"text","required":"optional","why":"It tells us who is affected when the view changes.","asked_of_text":"Digital IT","requirement":"Optional","example":"Crack Spreads Pricing: Crack Spread Price Analytics"},{"id":"7.9","section":"7","text":"What shows that these facts are right: a discovery run, a design document or a workspace export, and of what date?","type":"text","required":"required","ask_when":[{"question":"7.1","is":"@not-in-list"}],"why":"The table facts need a source, like the definition.","asked_of_text":"Digital IT","requirement":"Required if 7.1 is \"not in the list\"","example":"Not asked for the filled examples. An answer names the document and its date."},{"id":"7.10","section":"7","text":"Besides the view or table in 7.1, is there an API or file feed that supplies these values? Give its name and where its documentation is kept. Leave blank if none.","help":"List reports and AI assistants in 7.8.","type":"text","required":"optional","why":"It tells a builder how to read the KPI without opening the view by hand.","asked_of_text":"Digital IT","requirement":"Optional","example":"The ontology holds no access path, so the filled examples leave this empty."},{"id":"D1","section":"D","text":"What is the domain called?","type":"text","required":"required","why":"It needs one name before a KPI can be tied to it.","asked_of_text":"Domain Owner","requirement":"Required"},{"id":"D2","section":"D","text":"In two or three sentences, what data does the domain cover, and what does it leave to other domains?","type":"long_text","required":"required","why":"Two domains must not own the same data.","asked_of_text":"Domain Owner","requirement":"Required"},{"id":"D3","section":"D","text":"Who is the Domain Owner? Give the position.","type":"text","required":"required","why":"The Domain Owner confirms every KPI of the domain and signs this form.","asked_of_text":"Program manager","requirement":"Required"},{"id":"D4","section":"D","text":"Who are the Data Owners, and which part of the domain's data does each own? Write one line for each.","type":"list","required":"required","why":"A Data Owner gives and signs the definition of each KPI on their part of the data.","asked_of_text":"Domain Owner","requirement":"Required"},{"id":"D5","section":"D","text":"Who are the Data Stewards? Write one line for each.","type":"list","required":"required","why":"A Data Steward gives the facts about each KPI and its other names.","asked_of_text":"Domain Owner","requirement":"Required"},{"id":"D6","section":"D","text":"Which data products belong to the domain?","type":"multi_choice","source":"data-products","required":"optional","why":"It prepares question 6.6 and section 7 of each KPI form.","option":[{"id":"@new-data-products","label":"New data products (name them below)"}],"detail":{"label":"Each new data product","type":"long_text","required_when":"@new-data-products"},"asked_of_text":"Data Product Owner","requirement":"Optional"},{"id":"D7","section":"D","text":"Which business areas does the domain serve?","type":"multi_choice","source":"business-areas","required":"required","why":"A domain's data is used by one or more functions of the business.","asked_of_text":"Domain Owner","requirement":"Required"},{"id":"D8","section":"D","text":"Which processes does the domain serve?","type":"multi_choice","source":"processes","levels":[1,3],"required":"optional","why":"It shows where the domain's KPIs will attach.","asked_of_text":"Domain Owner","requirement":"Optional"},{"id":"D9","section":"D","text":"Which KPIs should be added first?","type":"list","required":"required","why":"Each one then gets its own KPI form.","asked_of_text":"Domain Owner","requirement":"Required"},{"id":"D10","section":"D","text":"What is the written basis for the domain: a charter or a decision? Give the document and its date.","type":"text","required":"required","why":"A domain is active by a recorded decision, like a KPI.","asked_of_text":"Domain Owner","requirement":"Required"},{"id":"P1","section":"P","text":"What is missing from the process map: a business area, a process, a step or a role? Name each one.","type":"list","required":"required","why":"The KPI must hang on a process the ontology knows.","asked_of_text":"Global Process Owner","requirement":"Required"},{"id":"P2","section":"P","text":"For each missing process or step, which process in the map sits above it?","type":"multi_choice","source":"processes","levels":[0,6],"required":"optional","why":"The parent says where the new entry goes in the tree.","asked_of_text":"Global Process Owner","requirement":"Optional"},{"id":"P3","section":"P","text":"What is the purpose of each missing process or step, in one sentence?","type":"list","required":"optional","why":"The first sentence becomes the definition.","asked_of_text":"Global Process Owner","requirement":"Optional"},{"id":"P4","section":"P","text":"What are the steps of each missing process, in order?","type":"list","required":"optional","why":"KPIs attach to steps where they can.","asked_of_text":"Global Process Owner","requirement":"Optional"},{"id":"P5","section":"P","text":"Which roles work in these processes?","type":"multi_choice","source":"roles","required":"optional","why":"Roles are who uses the KPI and who answers for the work.","option":[{"id":"@new-roles","label":"New roles (describe them below)"}],"detail":{"label":"Each new role, with a one-sentence description","type":"long_text","required_when":"@new-roles"},"asked_of_text":"Global Process Owner","requirement":"Optional"},{"id":"P6","section":"P","text":"For each process, which role does the work, which answers for it, which is consulted, and which is informed? Write one line for each: the process, the role, and one of responsible, accountable, consulted or informed.","type":"list","required":"optional","why":"It records who to ask when the KPI moves.","asked_of_text":"Global Process Owner","requirement":"Optional"},{"id":"P7","section":"P","text":"Which documents describe them: a process manual, a policy, a published report?","type":"list","required":"required","why":"Every fact added needs a written source.","asked_of_text":"Global Process Owner","requirement":"Required"},{"id":"T1","section":"T","text":"Which measure do you want to change?","type":"choice","source":"measures","required":"required","why":"A term change changes one measure the ontology already holds. A new KPI uses the KPI form.","asked_of_text":"Data Owner","requirement":"Required"},{"id":"T2","section":"T","text":"What should the measure be called from now on? Leave this empty to keep its name.","type":"text","required":"optional","why":"A new name replaces the old one everywhere the ontology shows the measure.","asked_of_text":"Data Owner","requirement":"Optional"},{"id":"T3","section":"T","text":"What should its definition say from now on? Leave this empty to keep the definition.","type":"long_text","required":"optional","why":"The definition says what the number means. Every report and answer reads it.","asked_of_text":"Data Owner","requirement":"Optional"},{"id":"T4","section":"T","text":"Which other names should it gain?","type":"list","required":"optional","why":"A person who searches with their own word then finds the measure.","asked_of_text":"Data Owner","requirement":"Optional"},{"id":"T5","section":"T","text":"Which of its other names should it lose? Write each one as the ontology holds it.","type":"list","required":"optional","why":"An other name that is wrong leads people to the wrong measure.","asked_of_text":"Data Owner","requirement":"Optional"},{"id":"T6","section":"T","text":"Which processes should the measure be linked to, in addition to the ones it has?","type":"multi_choice","source":"processes","levels":[0,6],"required":"optional","why":"The link says which work the number tells people about.","asked_of_text":"Data Owner","requirement":"Optional"},{"id":"T7","section":"T","text":"Which processes should the measure no longer be linked to?","type":"multi_choice","source":"processes","levels":[0,6],"required":"optional","why":"A link that is wrong points people at the wrong work.","asked_of_text":"Data Owner","requirement":"Optional"},{"id":"T8","section":"T","text":"Would every report and answer that used the old meaning still be correct?","type":"choice","source":"choices:yes-no-not-sure","required":"required","why":"A \"no\" or a \"not sure\" makes the change major: people who used the old meaning may now be wrong, so the Ontology Owner signs too.","asked_of_text":"Data Owner, Architect","requirement":"Required"},{"id":"R1","section":"R","text":"What is the new item called?","type":"text","required":"required","help":"For a table, write its full name as Databricks writes it: catalog.schema.table.","why":"The name is how people find the item. Each item has its own name.","asked_of_text":"Data Owner","requirement":"Required"},{"id":"R2","section":"R","text":"What kind of item is it?","type":"choice","source":"choices:reference-item-kinds","required":"required","why":"The kind decides where the item goes in the ontology and what else the form asks.","route":[{"when":"built-table","outcome":"needs-specialist","notice":"A table that Databricks builds from other tables is a data product. It needs its kind, the test that decided it, the reason and its lineage, which a specialist works out. This form adds only a table that copies a table of a system."},{"when":"source","outcome":"needs-specialist","notice":"A new source document changes two modules: the module that cites it, and the integration module, which gives every source its evidence tier. This form changes one module, so a new source document needs a specialist for now."},{"when":"role","outcome":"needs-specialist","notice":"Every role of the ontology comes from the RACI lists of the process map, which is the process authority. A new role starts with the process map request, and a specialist then changes the RACI."},{"when":"data-product","outcome":"needs-specialist","notice":"The data-product catalog is built from the portfolio file of the process authority, not from a table that this form can change. A new data product needs a specialist."}],"asked_of_text":"Data Owner","requirement":"Required"},{"id":"R3","section":"R","text":"What does the system do? Say it in one or two sentences, without repeating its name.","type":"long_text","required":"required","ask_when":[{"question":"R2","is":"system"}],"why":"The definition tells people what the system is for, so they do not mistake it for another.","asked_of_text":"Data Owner","requirement":"Required if R2 is \"a system that a document names: an application, an office tool or a working document\""},{"id":"R4","section":"R","text":"What other names or short forms do people use for the system?","type":"list","required":"optional","ask_when":[{"question":"R2","is":"system"}],"why":"A person who searches with their own word then finds the system.","asked_of_text":"Data Owner","requirement":"Optional if R2 is \"a system that a document names: an application, an office tool or a working document\""},{"id":"R5","section":"R","text":"What kind of system is it?","type":"choice","source":"system-kinds","required":"required","ask_when":[{"question":"R2","is":"system"}],"why":"An application, an office tool and a working document are read in different ways.","asked_of_text":"Data Owner","requirement":"Required if R2 is \"a system that a document names: an application, an office tool or a working document\""},{"id":"R6","section":"R","text":"Which document names the system?","type":"choice","source":"system-sources","required":"required","ask_when":[{"question":"R2","is":"system"}],"help":"The list holds the documents the system module already cites. A document that is not in the list needs a specialist first.","why":"Every system of the ontology is named by a document that a reader can check.","asked_of_text":"Data Owner","requirement":"Required if R2 is \"a system that a document names: an application, an office tool or a working document\""},{"id":"R7","section":"R","text":"Which other documents does the description of the system rest on?","type":"multi_choice","source":"system-sources","required":"optional","ask_when":[{"question":"R2","is":"system"}],"why":"A reader can check the definition against each document it rests on.","asked_of_text":"Data Owner","requirement":"Optional if R2 is \"a system that a document names: an application, an office tool or a working document\""},{"id":"R8","section":"R","text":"Which system's table does the table copy?","type":"choice","source":"systems","required":"required","ask_when":[{"question":"R2","is":"table"}],"help":"A system that is not in the list goes in first, with a reference-item form of its own.","why":"A replica is a copy of one system's table, and the lineage of every table built from it reaches that system.","asked_of_text":"Digital IT","requirement":"Required if R2 is \"a table in databricks that copies a table of a system (a replica)\""},{"id":"R9","section":"R","text":"Which document records the table?","type":"choice","source":"table-sources","required":"required","ask_when":[{"question":"R2","is":"table"}],"help":"The list holds the documents that record the module's tables. A document that is not in the list needs a specialist first.","why":"Every table of the ontology is recorded by a document that a reader can check.","asked_of_text":"Digital IT","requirement":"Required if R2 is \"a table in databricks that copies a table of a system (a replica)\""}],"choices":{"yes-no":[{"id":"yes","label":"Yes"},{"id":"no","label":"No"}],"yes-no-not-sure":[{"id":"yes","label":"Yes"},{"id":"no","label":"No"},{"id":"not-sure","label":"Not sure"}],"reference-item-kinds":[{"id":"system","label":"A system that a document names: an application, an office tool or a working document"},{"id":"table","label":"A table in Databricks that copies a table of a system (a replica)"},{"id":"built-table","label":"A table or a view that Databricks builds from other tables"},{"id":"source","label":"A source document"},{"id":"role","label":"A role"},{"id":"data-product","label":"A data product of the data-product catalog"}],"environment":[{"id":"sandbox","label":"Sandbox"},{"id":"production","label":"Production"}]},"settings_lists":{"visibility":[{"id":"anyone","label":"Anyone in the company"},{"id":"restricted","label":"Restricted"}],"status":[{"id":"draft","label":"Draft"},{"id":"certified","label":"Certified"},{"id":"retired","label":"Retired"}],"domains":[{"id":"customer","label":"Customer","description":"Who the company sells to: accounts, sites, contracts and the terms agreed with each.","active":false},{"id":"product","label":"Product","description":"What the company makes and sells: grades, specifications and product codes.","active":false},{"id":"market-price","label":"Market Price","description":"Prices set outside the company: crude and product benchmarks, differentials and crack spreads.","active":true},{"id":"supply-and-demand-plan","label":"Supply and Demand Plan","description":"The plans for crude supply, refinery runs and product demand, with their versions.","active":false},{"id

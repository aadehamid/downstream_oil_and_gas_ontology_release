<script id="intake-script">
"use strict";
// ---- The data and the state ------------------------------------------------------------------------------------
const DATA = JSON.parse(document.getElementById("intake-data").textContent);
const FORMS = Object.keys(DATA.forms);
const BY_ID = Object.fromEntries(DATA.questions.map((q) => [q.id, q]));
const DRAFT_KEY = "kpi-intake-draft-1";
const SHOWN = 40;              // options a long list shows at once
const LONG = 8;                // a list with more options than this gets a search box
const $ = (id) => document.getElementById(id);

// An empty form. With a form's name, each question of that form that has a default starts with it.
function emptyForm(form) {
  const answers = {};
  if (form) for (const q of DATA.questions) if (q.default && DATA.sections.find((s) => s.id === q.section).form === form) answers[q.id] = q.default;
  return { answers, request: {}, sign_offs: {}, consulted: {}, example_of: "", comment: "" };
}
let state = Object.fromEntries(FORMS.map((f) => [f, emptyForm(f)]));
let view = FORMS[0];
const showAll = {};            // question id -> true when the reader asked for the whole list
const narrow = matchMedia("(max-width: 999px)");   // the folded frame of a phone, a narrow window or a zoomed page
// Each name of a term that a module other than the measures holds, as the check compares names, with its module and
// whether a term of that name has a definition. Where several terms share a name, one with a definition is kept.
const TERM = new Map();
for (const [module, held] of Object.entries(DATA.term_names || {})) {
  for (const [defined, names] of [[true, held.defined || []], [false, held.undefined || []]]) {
    for (const name of names) { const key = norm(name); if (!TERM.has(key) || (defined && !TERM.get(key).defined)) TERM.set(key, { module, defined }); }
  }
}
// What each of the two Domain Owner signatures of the KPI form is for.
const SIGNER_LABELS = { "domain-confirmation": "Domain confirmation", "domain-owner": "Conflicting definitions" };
// The next step of an answer that sends the request to one of the two smaller forms.
const ROUTE_STEPS = {
  "domain-activation": { title: "Domain activation required before this KPI can be added", open: "Open the domain activation form" },
  "process-map-request": { title: "Process map request required before this KPI can be added", open: "Open the process map request" },
};

function current() { return state[view]; }
function formOf(q) { return DATA.sections.find((s) => s.id === q.section).form; }
function questionsOf(form) { return DATA.questions.filter((q) => formOf(q) === form); }

// ---- The rules (the same as kpi_store/intake/rules.py) ---------------------------------------------------------
function values(answers, key) {
  const v = answers[key];
  if (v === undefined || v === null) return [];
  return (Array.isArray(v) ? v : [v]).map((x) => String(x).trim()).filter(Boolean);
}
function positions(answers, key) {
  const v = answers[key];
  if (v === undefined || v === null) return [];
  return (Array.isArray(v) ? v : [v]).map((x) => String(x).trim());
}
function realValues(answers, key) { return values(answers, key).filter((v) => !v.startsWith("@")); }
function isAsked(q, answers, seen) {
  seen = seen || new Set();
  for (const cond of q.ask_when || []) {
    const target = BY_ID[cond.question];
    const asked = !seen.has(target.id) && isAsked(target, answers, new Set([...seen, q.id]));
    const held = asked ? values(answers, target.id) : [];
    if ("is" in cond && !held.includes(cond.is)) return false;
    if ("is_not" in cond && held.includes(cond.is_not)) return false;
    if ("answered" in cond && (held.length > 0) !== cond.answered) return false;
  }
  return true;
}
function isChoice(q) { return q.type === "choice" || q.type === "multi_choice"; }
function isMany(q) { return q.type === "multi_choice" || q.type === "list"; }
function baseList(q) {
  const [kind, name] = q.source.includes(":") ? q.source.split(":") : ["", q.source];
  if (kind === "choices") return DATA.choices[name];
  if (kind === "settings") return DATA.settings_lists[name].map((i) => Object.assign({}, i, { label: i.label + (i.active === false ? " (not active)" : "") }));
  return DATA.lists[name];
}
function isUnder(byId, item, ancestor) {
  let at = byId[item.parent];
  while (at) { if (at.id === ancestor) return true; at = byId[at.parent]; }
  return false;
}
// What a question offers: every item its levels allow (narrowed = false), or only those the earlier answers
// leave (narrowed = true), then its special options. An entry that the organization's settings hide is not offered.
// It stays, with a mark in its label, only while an answer holds it, so that a loaded file shows what it chose.
function optionsOf(q, answers, narrowed) {
  if (!isChoice(q)) return [];
  let items = baseList(q);
  if (items.some((i) => i.hidden)) {
    const held = values(answers, q.id);
    items = items.filter((i) => !i.hidden || !narrowed || held.includes(i.id)).map((i) => i.hidden ? Object.assign({}, i, { label: i.label + DATA.hidden_mark }) : i);
  }
  if (q.levels) items = items.filter((i) => i.level >= q.levels[0] && i.level <= q.levels[1]);
  if (narrowed && q.under) {
    const top = realValues(answers, q.under)[0];
    if (top) { const byId = Object.fromEntries(baseList(q).map((i) => [i.id, i])); items = items.filter((i) => isUnder(byId, i, top)); }
  }
  if (narrowed && q.narrow_by && !showAll[q.id]) {
    const area = realValues(answers, q.narrow_by)[0];
    const inArea = area ? items.filter((i) => (i.areas || []).includes(area)) : [];
    if (inArea.length) items = inArea;
  }
  return items.concat(q.option || []);
}
function perMissing(q, answers) {
  const mine = positions(answers, q.id);
  return positions(answers, q.per).filter((v, i) => v && !v.startsWith("@") && !mine[i]);
}
function detailRequired(q, answers) {
  if (!q.detail || q.detail.required_when === "never") return false;
  return q.detail.required_when === "always" || values(answers, q.id).includes(q.detail.required_when);
}
function isComplete(q, answers) {
  if (q.per) { if (perMissing(q, answers).length) return false; }
  else if (!values(answers, q.id).length) return false;
  return !detailRequired(q, answers) || values(answers, q.id + ".detail").length > 0;
}
function kindOf(answers) {
  for (const rule of DATA.kind_rules) {
    const q = BY_ID[rule.question];
    if (isAsked(q, answers) && values(answers, q.id).includes(rule.answer)) return rule;
  }
  return null;
}
function routesOf(q, answers) {
  if (!q.route || !isAsked(q, answers)) return [];
  const offered = Object.fromEntries(optionsOf(q, answers, false).map((o) => [o.id, o]));
  const held = values(answers, q.id);
  const out = [];
  for (const route of q.route) {
    for (const v of held) {
      const hit = route.when === "@inactive" ? (offered[v] || {}).active === false : v === route.when;
      if (hit) out.push({ route, label: (offered[v] || {}).label || v });
    }
  }
  return out;
}
function norm(name) { return name.toLowerCase().replace(/[^a-z0-9&]+/g, " ").trim().replace(/\s+/g, " "); }

// ---- Small helpers ---------------------------------------------------------------------------------------------
function clone(id) { return document.getElementById(id).content.firstElementChild.cloneNode(true); }
function say(text, kind) { $("status").textContent = text; $("status").dataset.kind = kind || ""; }

// ---- Reading what a file or a draft holds ----------------------------------------------------------------------
const isObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const isText = (v) => typeof v === "string";
const brief = (text) => String(text).slice(0, 40);
// What is wrong with the parts of one form, in words, or "" when each part has the type answers.schema.json gives.
function partsProblem(held) {
  if (!isObject(held)) return "it is not a JSON object";
  if (!isObject(held.answers)) return 'it has no "answers" object';
  for (const [id, v] of Object.entries(held.answers)) {
    if (!(isText(v) || (Array.isArray(v) && v.every(isText)))) return `the answer to ${brief(id)} is neither a text nor a list of texts`;
  }
  for (const key of ["catalogue_version", "kpi_name", "example_of", "comment"]) {
    if (key in held && !isText(held[key])) return `"${key}" is not a text`;
  }
  if ("request" in held && !(isObject(held.request) && Object.values(held.request).every(isText))) return '"request" does not hold a text for each field';
  for (const key of ["sign_offs", "consulted"]) {
    if (!(key in held)) continue;
    const ok = isObject(held[key]) && Object.values(held[key]).every((entry) => isObject(entry) && Object.values(entry).every(isText));
    if (!ok) return `"${key}" does not hold texts for each entry`;
  }
  return "";
}
function fileProblem(data) {
  if (!isObject(data)) return "it is not a JSON object";
  if (data.format !== 1) return 'its "format" is not 1';
  if (!FORMS.includes(data.form)) return 'its "form" names none of the five forms';
  return partsProblem(data);
}
function saveDraft() {
  // A draft survives a reload when the browser allows storage. A private window may refuse it.
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ state, view })); } catch (e) { /* the form still works */ }
}
// "ok" when a draft was restored, "bad" when there was one and any part of it was malformed, "" when there was none.
// A draft is restored whole or not at all, and the view it names is opened only when it is restored.
function loadDraft() {
  let text = null;
  try { text = localStorage.getItem(DRAFT_KEY); } catch (e) { return ""; }
  if (!text) return "";
  let held = null;
  try { held = JSON.parse(text); } catch (e) { held = null; }
  // Whole means: every form is there, each with every part that emptyForm() gives, and each part of the right type.
  const parts = Object.keys(emptyForm());
  const whole = isObject(held) && isObject(held.state)
    && FORMS.every((f) => isObject(held.state[f]) && parts.every((part) => part in held.state[f]) && !partsProblem(held.state[f]));
  if (!whole) {
    // The next change writes a new draft over it, so the unread one is kept aside under another key.
    try { localStorage.setItem(DRAFT_KEY + "-unread", text); } catch (e) { /* it is lost with the next change */ }
    return "bad";
  }
  for (const f of FORMS) state[f] = Object.assign(emptyForm(), held.state[f]);
  if (FORMS.includes(held.view)) view = held.view;
  return "ok";
}

// How a stored value finds its entry: the one rule of kpi_store/intake/rules.py. A value names an entry when it is
// the entry's id, an id the settings once added it under, its label of today or a label it had before, and a label
// counts with or without the mark of a hidden or of a new entry. The map gives [the entry's id, gained], where
// gained says the value was stored while the entry was only an addition of the settings.
// A label without the mark at its end. Only the end counts: a label may hold the mark's words inside it.
function withoutMark(label, mark) {
  return label.endsWith(mark) ? label.slice(0, label.length - mark.length) : label;
}
function resolverOf(q) {
  const map = new Map();
  const items = DATA.lists[q.source];
  for (const item of items) map.set(item.id, [item.id, false]);
  for (const item of items) {
    const plain = item.added ? withoutMark(item.label, DATA.added_mark) : item.label;
    const gained = (item.aliases || []).length > 0;
    for (const name of [plain].concat(item.was || [])) {
      for (const mark of ["", DATA.hidden_mark, DATA.added_mark]) if (!map.has(name + mark)) map.set(name + mark, [item.id, gained && mark === DATA.added_mark]);
    }
    for (const alias of item.aliases || []) if (!map.has(alias)) map.set(alias, [item.id, true]);
  }
  return map;
}
// Reads each stored answer of a form on a list the settings can change as its entry's id of today. Returns the
// labels of the entries that were stored under an addition the ontology has since gained.
function readAliases(form) {
  const found = [];
  const answers = state[form].answers;
  for (const q of questionsOf(form)) {
    if (!isChoice(q) || !(q.source in DATA.added_modules) || !(q.id in answers)) continue;
    const known = resolverOf(q);
    const labels = Object.fromEntries(DATA.lists[q.source].map((i) => [i.id, i.label]));
    const swap = (v) => {
      if (typeof v !== "string" || v.startsWith("@") || !known.has(v)) return v;
      const [id, gained] = known.get(v);
      if (gained) found.push(labels[id]);
      return id;
    };
    const held = answers[q.id];
    answers[q.id] = Array.isArray(held) ? held.map(swap).filter((v, i, all) => q.per || all.indexOf(v) === i) : swap(held);
  }

}
function aliasLine(found) {
  return found.map((label) => ` "${label}" is now in the ontology; the answer was read as that entry.`).join("");
}

// ---- Changing an answer ----------------------------------------------------------------------------------------
function dependents(id) { return DATA.questions.filter((q) => q.narrow_by === id || q.under === id || q.per === id); }
function setAnswer(q, value) {
  const answers = current().answers;
  if (Array.isArray(value) ? value.length === 0 : value === "") delete answers[q.id]; else answers[q.id] = value;
  for (const dep of dependents(q.id)) {
    if (dep.under === q.id) {
      const allowed = new Set(optionsOf(dep, answers, true).map((o) => o.id));
      if (values(answers, dep.id).some((v) => !allowed.has(v))) delete answers[dep.id];
    }
    redraw(dep);
  }
  changed();
}
// A multi-choice answer changes by one item, so the answers of the questions that follow it step by step
// (q.per) stay beside the step they belong to.
function toggle(q, id, on) {
  const answers = current().answers;
  const held = positions(answers, q.id);
  const at = held.indexOf(id);
  const followers = DATA.questions.filter((d) => d.per === q.id);
  if (on && at < 0) {
    held.push(id);
    for (const d of followers) { const mine = positions(answers, d.id); while (mine.length < held.length) mine.push(""); answers[d.id] = mine; }
  } else if (!on && at >= 0) {
    held.splice(at, 1);
    for (const d of followers) { const mine = positions(answers, d.id); mine.splice(at, 1); if (mine.some(Boolean)) answers[d.id] = mine; else delete answers[d.id]; }
  }
  setAnswer(q, held);
}
function changed() { saveDraft(); refresh(); }

// ---- Drawing one question's input ------------------------------------------------------------------------------
function redraw(q) {
  const card = document.querySelector(`[data-question="${q.id}"]`);
  if (card) drawInput(q, card.querySelector(".q-input"));
}
function drawInput(q, box) {
  box.replaceChildren();
  const answers = current().answers;
  if (q.per) return drawPer(q, box);
  if (isChoice(q)) return box.append(picker(q));
  if (q.type === "list") {
    const area = document.createElement("textarea");
    area.name = q.id;
    area.setAttribute("aria-label", q.text);
    area.value = positions(answers, q.id).join("\n");
    area.addEventListener("input", () => setAnswer(q, area.value.split("\n").map((s) => s.trim()).filter(Boolean)));
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "Write one answer on each line.";
    return box.append(area, hint);
  }
  const input = document.createElement(q.type === "long_text" ? "textarea" : "input");
  if (q.type !== "long_text") input.type = "text";
  input.name = q.id;
  input.autocomplete = "off";
  input.setAttribute("aria-label", q.text);
  input.value = values(answers, q.id)[0] || "";

}
// One row for each step chosen in the question this one follows.
function drawPer(q, box) {
  const answers = current().answers;
  const base = BY_ID[q.per];
  const labels = Object.fromEntries(optionsOf(base, answers, false).map((o) => [o.id, o.label]));
  const steps = positions(answers, base.id);
  let rows = 0;
  steps.forEach((step, i) => {
    if (!step || step.startsWith("@")) return;
    rows += 1;
    const row = document.createElement("div");
    row.className = "per-row";
    const label = document.createElement("label");
    label.textContent = labels[step] || step;
    const set = (text) => { const mine = positions(answers, q.id); while (mine.length < steps.length) mine.push(""); mine[i] = text; answers[q.id] = mine; changed(); };
    let control;
    if (isChoice(q)) {
      control = document.createElement("select");
      control.append(new Option("Choose", ""));
      const mine = positions(answers, q.id)[i] || "";
      for (const o of optionsOf(q, answers, false)) if (!o.hidden || o.id === mine) control.append(new Option(o.label, o.id));
      control.value = mine;
      control.addEventListener("change", () => set(control.value));
    } else {
      control = document.createElement("input");
      control.type = "text";
      control.autocomplete = "off";
      control.value = positions(answers, q.id)[i] || "";
      control.addEventListener("input", () => set(control.value.trim()));
    }
    control.name = `${q.id}#${i + 1}`;
    control.id = `per-${q.id}-${i}`;
    label.htmlFor = control.id;
    row.append(label, control);
    box.append(row);
  });
  if (!rows) { const hint = document.createElement("p"); hint.className = "hint"; hint.textContent = `Answer ${base.id} first.`; box.append(hint); }
}
function picker(q) {
  const node = clone("tpl-picker");
  const chosen = node.querySelector(".picker-chosen");
  const search = node.querySelector(".picker-search");
  const list = node.querySelector(".picker-list");
  const more = node.querySelector(".picker-more");
  const all = node.querySelector(".picker-all");
  const multi = q.type === "multi_choice";
  function draw() {
    const answers = current().answers;
    const offered = optionsOf(q, answers, true);
    const labels = Object.fromEntries(optionsOf(q, answers, false).map((o) => [o.id, o.label]));
    const held = values(answers, q.id);
    const long = offered.length > LONG;
    search.hidden = !long;
    list.classList.toggle("short", !long);
    all.hidden = !(q.narrow_by && realValues(answers, q.narrow_by).length);
    all.querySelector("input").checked = !!showAll[q.id];
    chosen.replaceChildren();
    if (long) for (const id of held) {
      const item = clone("tpl-chosen");
      item.querySelector(".chosen-label").textContent = labels[id] || id;
      item.querySelector("button").setAttribute("aria-label", `Remove ${labels[id] || id}`);
      item.querySelector("button").addEventListener("click", () => { multi ? toggle(q, id, false) : setAnswer(q, ""); draw(); });
      chosen.append(item);
    }
    const term = search.value.trim().toLowerCase();
    const special = offered.filter((o) => o.id.startsWith("@"));
    const hits = offered.filter((o) => !o.id.startsWith("@") && (!term || o.label.toLowerCase().includes(term)));
    const shown = hits.slice(0, long ? SHOWN : hits.length).concat(special);
    list.replaceChildren();
    for (const o of shown) {
      const item = clone("tpl-option");
      const input = item.querySelector("input");
      input.type = multi ? "checkbox" : "radio";
      input.name = q.id;
      input.value = o.id;
      input.checked = held.includes(o.id);
      input.addEventListener("change", () => { multi ? toggle(q, o.id, input.checked) : setAnswer(q, o.id); draw(); });
      item.querySelector(".option-label").textContent = o.label;
      item.querySelector(".option-about").textContent = o.description || "";
      list.append(item);
    }
    const left = hits.length - Math.min(hits.length, long ? SHOWN : hits.length);
    more.hidden = !(left > 0 || (!hits.length && term));
    more.textContent = left > 0 ? `${left} more. Type to narrow the list.` : "Nothing in the list matches.";
  }
  search.addEventListener("input", draw);
  all.querySelector("input").addEventListener("change", (e) => { showAll[q.id] = e.target.checked; draw(); });
  draw();
  return node;
}

// ---- What changes with every answer: which questions show, the notices, the progress -----------------------------
// `more` may add: who does the next step, the reviewers to bring in, a button to the next step, and a line for the analyst.
function notice(box, key, title, text, blocks, more) {

  }

  if (more.analyst) { const aside = node.querySelector(".notice-analyst"); aside.hidden = false; aside.querySelector("p").textContent = more.analyst; }

function routeNotice(box, hit) {
  const id = hit.route.outcome;
  const outcome = DATA.outcomes[id];
  const step = ROUTE_STEPS[id];
  if (step) {
    // The request goes to a smaller form: say who answers and signs it, and open it from here.
    const target = DATA.sections.find((s) => s.form === id);
    return notice(box, id, step.title, hit.route.notice, outcome.blocks,
      { who: target.who, open: step.open, go: () => { show(id); scrollTo(0, 0); $("view").focus(); }, analyst: outcome.next });
  }
  const consult = DATA.sign_off.consulted.find((c) => c.id === outcome.consult);
  // The catalogue's next step is added unless the notice already says it.
  const next = outcome.next && !hit.route.notice.includes(outcome.next.slice(0, 40)) ? " " + outcome.next : "";
  notice(box, id, outcome.title, hit.route.notice + next, outcome.blocks,
    consult ? { reviewers: consult.who.split(/,\s*|\s+and\s+/).filter(Boolean), open: "Go to the sign-off block", go: goToSignoff } : {});
}
function goToSignoff() { $("signoff").scrollIntoView(); $("signoff").querySelector("[data-consult]").focus({ preventScroll: true }); }
// A signature is needed for every KPI, or only when the check finds a conflict. A smaller form needs each of its
// own, except one that only an answer calls for: the Ontology Owner signs a term change only when it is major.
function isNeeded(signer, form, answers) {
  if (signer.when === "answer") return signer.answers.some((a) => values(answers || {}, signer.answer_of).includes(a));
  return signer.when === "always" || form !== FORMS[0];
}
// What a signature means on this form: a domain activation and a term change may give a signer its own words.
function meaningOf(signer, form) {
  const own = { "domain-activation": signer.activation_meaning, "term-change": signer.change_meaning,
    "reference-item": signer.item_meaning }[form];
  return own || signer.meaning;
}
function left(count) { return count ? `${count} required ${count === 1 ? "answer" : "answers"} left` : "Required answers complete"; }
function refresh() {
  if (!FORMS.includes(view)) return;
  const held = current();
  const answers = held.answers;
  let formLeft = 0;
  let elsewhere = "";            // the module that already holds the KPI's name as a term, when one does
  let mayConflict = false;       // true when that term and the KPI both have a definition, so the two may differ
  for (const section of DATA.sections.filter((s) => s.form === view)) {
    const node = document.querySelector(`[data-section="${section.id}"]`);
    if (!node) continue;
    let required = 0, missing = 0, optional = 0, skipped = 0;
    const routed = [];
    for (const q of DATA.questions.filter((x) => x.section === section.id)) {
      const card = node.querySelector(`[data-question="${q.id}"]`);
      const on = isAsked(q, answers);
      card.hidden = !on;
      if (!on) { skipped += 1; continue; }
      // The count follows the check: a required question that is not complete is left, and so is an answered
      // question, required or not, whose answer makes its extra text required while that text is missing.
      const owesDetail = detailRequired(q, answers) && values(answers, q.id).length > 0;
      if (q.required === "required") { required += 1; if (!isComplete(q, answers)) missing += 1; }
      else if (owesDetail) { required += 1; if (!values(answers, q.id + ".detail").length) missing += 1; }
      else if (!values(answers, q.id).length) optional += 1;
      const detail = card.querySelector(".q-detail");
      if (q.detail) {
        detail.hidden = !(q.detail.required_when === "always" || detailRequired(q, answers) || values(answers, q.id + ".detail").length);
        detail.querySelector(".q-detail-need").hidden = !(q.required === "required" ? detailRequired(q, answers) : owesDetail);
      }
      const box = card.querySelector(".q-notices");
      const hits = routesOf(q, answers);
      let same = null;
      if (q.id === "2.1") {
        const name = norm(values(answers, "2.1")[0] || "");
        same = name && DATA.lists.measures.find((m) => [m.label].concat(m.other_names || []).some((n) => norm(n) === name));
        if (same && same.notation === held.example_of) same = null;
        const term = TERM.get(name);
        elsewhere = term ? term.module : "";
        // The check finds a conflict only when both definitions are there and differ: the term's, and the answer to 2.2.
        mayConflict = !!term && term.defined && values(answers, "2.2").length > 0;
      }
      // An answer that the organization's settings added: the ontology does not hold it yet.
      const module = isChoice(q) ? DATA.added_modules[q.source] : "";
      const added = module ? optionsOf(q, answers, false).filter((o) => o.added && values(answers, q.id).includes(o.id)) : [];
      for (const hit of hits) if (DATA.outcomes[hit.route.outcome].blocks) routed.push(DATA.forms[hit.route.outcome] ? "Routed: " + DATA.forms[hit.route.outcome].toLowerCase() : DATA.outcomes[hit.route.outcome].title);
      if (same) routed.push("Stopped: the ontology holds this measure");
      // The notices are drawn again only when they change, so a part a reader opened in one stays open.
      const there = q.id === "2.1" ? elsewhere : "";
      const drawn = JSON.stringify([hits.map((hit) => [hit.route.outcome, hit.route.notice]), same ? same.label : "", there, added.map((o) => o.id)]);
      if (box.dataset.drawn !== drawn) {
        box.dataset.drawn = drawn;
        box.replaceChildren();
        for (const hit of hits) routeNotice(box, hit);
        for (const o of added) {
          const name = withoutMark(o.label, DATA.added_mark);
          notice(box, "to-add", "You can continue with this entry",
            `"${name}" is available in this form but is not yet in the ontology. Continue filling in the KPI. The Architect must add this entry before adding the KPI.`, false,
            { analyst: `The Architect adds "${name}" to the ${module} module with HOW-TO-UPDATE.md. The check lists it under "To add to the ontology first".` });
        }
        if (same) notice(box, "same-measure", "The ontology already holds this measure", `"${same.label}" has this name. Stop the form. The request becomes a change to that measure.`, true);
        if (there) notice(box, "same-name", `This name exists in the ${there} module`,
          "The check will ask you to consult Enterprise Data Governance and to record the outcome in the sign-off block. If the two definitions differ, the Domain Owner decides between them and signs.",
          false, { open: "Go to the sign-off block", go: goToSignoff });
      }
    }
    // Ready is not the same as answered: the line counts the required answers left, then the optional ones, and
    // a section whose answer routes the request elsewhere says so instead of looking complete.
    const stage = routed.length ? "routed" : missing ? "open" : "complete";
    const routes = [...new Set(routed)].join(" · ");
    const text = (routed.length ? routes + (missing ? " · " + left(missing) : "") : left(missing)) + (optional ? ` · ${optional} optional unanswered` : "");
    formLeft += missing;
    node.querySelector(".section-progress").textContent = text;
    node.querySelector(".section-progress").dataset.state = stage;
    const skippedLine = node.querySelector(".section-skipped");
    skippedLine.hidden = !skipped;
    skippedLine.textContent = skipped === 1 ? "1 question does not apply and is hidden." : `${skipped} questions do not apply and are hidden.`;
    const kindLine = node.querySelector('[data-part="kind"]');
    if (section.id === "4") {
      const rule = kindOf(answers);
      kindLine.hidden = false;
      kindLine.textContent = rule ? `Kind of measure: ${rule.kind} (decided by ${rule.question}).` + (rule.note ? " " + rule.note : "") : "Kind of measure: not decided yet.";
    }
    const link = document.querySelector(`[data-nav="${section.id}"]`);
    if (link) {
      link.dataset.state = stage;
      link.querySelector(".nav-count").textContent = routed.length ? routes : left(missing);
      const bar = link.querySelector("progress");
      bar.max = Math.max(required, 1);
      bar.value = required ? required - missing : 1;
    }
  }
  $("sections-now").dataset.form = left(formLeft);
  const signers = DATA.sign_off.signer.filter((s) => s.forms.includes(view));
  const isSigned = (s) => { const g = held.sign_offs[s.id] || {}; return !!((g.name || "").trim() && (g.date || "").trim()); };
  // Only the signatures that are needed count. The conflict signature is needed when the check finds that another
  // module defines the KPI's name differently. The page holds those names and whether each has a definition, and
  // not the definitions. So when both definitions are there, that signature counts until the check has run, though
  // the check may then find the two equal. Otherwise it is named apart.
  const byAnswer = signers.filter((s) => s.when === "answer");
  const conflict = signers.filter((s) => s.when !== "answer" && !isNeeded(s, view, answers));
  const needed = (mayConflict ? signers.filter((s) => s.when !== "answer") : signers.filter((s) => s.when !== "answer" && isNeeded(s, view, answers)))
    .concat(byAnswer.filter((s) => isNeeded(s, view, answers)));
  for (const s of byAnswer) {
    const node = document.querySelector(`[data-signer="${s.id}"]`);
    if (!node) continue;
    node.querySelector(".signer-required").hidden = !isNeeded(s, view, answers);
    node.querySelector(".signer-status").hidden = isNeeded(s, view, answers);
  }
  const signed = needed.filter(isSigned).length;
  for (const s of conflict) {
    const status = document.querySelector(`[data-signer="${s.id}"] .signer-status`);
    if (status) status.textContent = mayConflict ? `Needed if the check confirms: the name exists in the ${elsewhere} module` : "Only if the check finds a conflicting definition";
  }
  const waiting = conflict.map((s) => mayConflict ? (isSigned(s) ? "" : "the conflict signature is needed if the check confirms")
    : (isSigned(s) ? "conflict signature recorded" : "conflict review pending check")).filter(Boolean);
  const line = document.querySelector('[data-part="signoff-progress"]');
  if (line) line.textContent = [`${signed} of ${needed.length} required signatures recorded`].concat(waiting).join(" · ");
  const link = document.querySelector('[data-nav="signoff"]');
  if (link) {
    link.dataset.state = signed === needed.length ? "complete" : "open";
    link.querySelector(".nav-count").textContent = `${signed} of ${needed.length} required signed`;
    const bar = link.querySelector("progress");
    bar.max = Math.max(needed.length, 1);
    bar.value = signed;
  }
  soon();
}

// ---- The other views -------------------------------------------------------------------------------------------
function drawRoles() {
  const node = clone("tpl-roles");
  const body = node.querySelector("tbody");
  for (const role of DATA.roles) {
    const row = document.createElement("tr");
    for (const text of [role.title, role.definition, role.in_intake]) { const cell = document.createElement("td"); cell.textContent = text; row.append(cell); }
    body.append(row);
  }
  $("view").replaceChildren(node);
}
function drawExplainer() {
  const node = clone("tpl-explainer");
  node.querySelector("h2").textContent = DATA.explainer.title;
  const body = node.querySelector(".explainer-body");
  for (const block of DATA.explainer.block) {
    if (block.p) { const p = document.createElement("p"); p.textContent = block.p; body.append(p); }
    if (block.ol) { const ol = document.createElement("ol"); for (const text of block.ol) { const li = document.createElement("li"); li.textContent = text; ol.append(li); } body.append(ol); }
  }
  $("view").replaceChildren(node);
}
const VIEWS = FORMS.map((f) => [f, DATA.forms[f]]).concat([["roles", "The roles"], ["explainer", "What we will ask you"]]);
function show(name) {
  view = name;
  const isForm = FORMS.includes(name);
  $("layout").classList.toggle("with-contents", isForm);
  $("contents").hidden = !isForm;
  for (const tab of document.querySelectorAll("[data-view]")) tab.setAttribute("aria-selected", String(tab.dataset.view === name));
  for (const id of ["save", "clear"]) $(id).disabled = !isForm;
  $("view-select").value = name;
  for (const id of ["signoff-nav", "sections-toggle"]) $(id).hidden = !isForm;
  closeSections();
  if (isForm) drawForm(name); else if (name === "roles") drawRoles(); else drawExplainer();
  saveDraft();
}

// ---- Save, load, clear ----------------------------------------------------------------------------------------
function asFile(form) {
  const held = state[form];
  const answers = {};
  for (const q of questionsOf(form)) {
    if (!isAsked(q, held.answers)) continue;              // an answer to a question that no longer applies is not saved
    const v = held.answers[q.id];
    if (isMany(q)) { const list = positions(held.answers, q.id); if (list.some(Boolean)) answers[q.id] = q.per ? list : list.filter(Boolean); }
    else if (values(held.answers, q.id).length) answers[q.id] = String(v).trim();
    const detail = values(held.answers, q.id + ".detail")[0];
    if (detail) answers[q.id + ".detail"] = detail;
  }
  const first = form === FORMS[0] ? "2.1" : questionsOf(form)[0].id;
  const pick = (map, keys) => Object.fromEntries(Object.entries(map).filter(([, v]) => keys.some((k) => (v[k] || "").trim())).map(([id, v]) => [id, Object.fromEntries(keys.map((k) => [k, (v[k] || "").trim()]))]));
  return {
    format: 1, form, catalogue_version: DATA.catalogue_version,
    kpi_name: form === FORMS[0] ? (values(answers, first)[0] || "") : values(answers, first).map((v) => labelOf(questionsOf(form)[0], v)).join("; "),
    request: Object.fromEntries(DATA.request_fields.map((f) => [f.id, (held.request[f.id] || "").trim()])),
    answers, sign_offs: pick(held.sign_offs, ["name", "date"]), consulted: pick(held.consulted, ["date", "outcome"]),
    example_of: held.example_of || "", comment: held.comment || "",
  };
}
// The label of a chosen item, or the value itself when the question is not a choice: a term change names its file
// after the measure's name, not its IRI.
function labelOf(q, value) {
  if (!isChoice(q)) return value;
  const item = optionsOf(q, {}, false).find((o) => o.id === value);
  return item ? item.label : value;
}
function fileName(data) {
  const slug = (data.kpi_name || "untitled").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "untitled";
  return `${slug}.${data.form}.json`;
}
function save() {
  const data = asFile(view);
  const blob = new Blob([JSON.stringify(data, null, 2) + "\n"], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = fileName(data);
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  // The browser was asked for a download. The page cannot know whether, or where, the file was kept.
  say(`Download requested: ${link.download}. Check that the file appears in your chosen folder.`);
}
function readFile(text, name) {
  // The file is checked whole before any of it is shown. A file that fails leaves every answer as it was.
  const refuse = (what) => say(`This file is not a KPI intake answers file: ${what}.`, "problem");
  let data;
  try { data = JSON.parse(text); } catch (e) { return refuse("it is not JSON"); }
  const problem = fileProblem(data);
  if (problem) return refuse(problem);
  // An answer under an id that the file's form does not ask is left out, and the status line lists it.
  const known = new Set();
  for (const q of questionsOf(data.form)) { known.add(q.id); if (q.detail) known.add(q.id + ".detail"); }
  const answers = {}, ignored = [];
  for (const [id, v] of Object.entries(data.answers)) { if (known.has(id)) answers[id] = v; else ignored.push(brief(id)); }
  const elsewhere = data.form !== view;
  state[data.form] = Object.assign(emptyForm(), {      // no defaults: the form shows what the file holds
    answers, request: data.request || {}, sign_offs: data.sign_offs || {}, consulted: data.consulted || {},
    example_of: data.example_of || "", comment: data.comment || "",
  });
  const gained = readAliases(data.form);
  show(data.form);
  say(`Loaded ${name}` + (elsewhere ? ` into the ${DATA.forms[data.form]} form.` : ".") + aliasLine(gained)
    + (data.catalogue_version && data.catalogue_version !== DATA.catalogue_version ? ` It was saved with catalogue ${data.catalogue_version}; this form is ${DATA.catalogue_version}.` : "")
    + (ignored.length ? ` Left out ${ignored.length} ${ignored.length === 1 ? "answer" : "answers"} that this form does not ask: ${ignored.slice(0, 8).join(", ")}${ignored.length > 8 ? " and more" : ""}.` : ""));
}
$("save").addEventListener("click", save);
$("load").addEventListener("click", () => $("load-file").click());
$("load-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { readFile(String(reader.result), file.name); e.target.value = ""; };
  reader.readAsText(file);
});
// "Clear this form" asks first, in the page: Cancel keeps every answer, Clear empties the form in view.
$("clear").addEventListener("click", () => {
  $("clear-text").textContent = `This empties the ${DATA.forms[view]} form in this browser: every answer, signature and comment. A file you saved is not changed.`;
  $("clear-dialog").showModal();
});
$("clear-cancel").addEventListener("click", () => $("clear-dialog").close());
$("clear-confirm").addEventListener("click", () => {
  $("clear-dialog").close();
  state[view] = emptyForm(view);
  show(view);
  say("The form is empty.");
});

// ---- The frame: the theme, the section in view, and the folded navigation of a narrow window ---------------------
// None of this changes an answer, a draft or a rule.
const THEME_KEY = "kpi-intake-theme";
const darkScheme = matchMedia("(prefers-color-scheme: dark)");
// Light, Dark or System. The choice sets data-theme on the root, and the styles hold both palettes.
function applyTheme() {
  const choice = $("theme").value;
  document.documentElement.dataset.theme = choice === "system" ? (darkScheme.matches ? "dark" : "light") : choice;
}
function startTheme() {
  let held = null;
  try { held = localStorage.getItem(THEME_KEY); } catch (e) { /* the choice then lasts for this visit only */ }
  $("theme").value = ["light", "dark", "system"].includes(held) ? held : "light";
  applyTheme();
  $("theme").addEventListener("change", () => {
    try { localStorage.setItem(THEME_KEY, $("theme").value); } catch (e) { /* the theme still changes */ }
    applyTheme();
  });
  darkScheme.addEventListener("change", applyTheme);
}
// The line of the section list whose section is on screen carries aria-current, and the Sections button of a folded
// frame names that section and what it still needs.
let queued = false, lastLine = null;
function markSection() {
  queued = false;
  let at = null;
  const links = document.querySelectorAll("[data-nav]");
  for (const link of links) {
    const target = document.getElementById(link.getAttribute("href").slice(1));
    if (target && target.getBoundingClientRect().top <= innerHeight * 0.4) at = link;
  }
  for (const link of links) { if (link === at) link.setAttribute("aria-current", "location"); else link.removeAttribute("aria-current"); }
  const now = $("sections-now");
  now.textContent = at ? `${at.querySelector(".nav-name").textContent} · ${at.querySelector(".nav-count").textContent}` : now.dataset.form || "";
  if (at && at !== lastLine && $("contents").contains(at)) {
    // Keep that line in sight when the list itself scrolls.
    const line = at.getBoundingClientRect(), box = $("contents").getBoundingClientRect();
    if (line.bottom > box.bottom) $("contents").scrollTop += line.bottom - box.bottom + 8;
    else if (line.top < box.top) $("contents").scrollTop -= box.top - line.top + 8;
  }
  lastLine = at;
}
function soon() { if (!queued) { queued = true; requestAnimationFrame(markSection); } }
// The sign-off line: its own fixed row beside the file buttons, or the last line of the list in a folded frame.
function placeSignoff() {
  const link = document.querySelector('[data-nav="signoff"]');
  if (link) (narrow.matches ? $("contents-list") : $("signoff-nav")).append(link.parentElement);
}
// In a folded frame the Sections button opens the section list over the page, and a choice closes it.
function openSections() {
  $("layout").classList.add("sections-open");
  $("sections-toggle").setAttribute("aria-expanded", "true");
  $("sections-close").focus();
}
function closeSections(back) {
  if (!$("layout").classList.contains("sections-open")) return;
  $("layout").classList.remove("sections-open");
  $("sections-toggle").setAttribute("aria-expanded", "false");
  if (back) $("sections-toggle").focus();
}
// The page leaves room for the bar of file buttons at its real height, whatever it holds.
function fitDock() { document.documentElement.style.setProperty("--dock-h", $("dock").offsetHeight + "px"); }
function startFrame() {
  startTheme();
  addEventListener("scroll", soon, { passive: true });
  addEventListener("resize", soon);
  narrow.addEventListener("change", () => { closeSections(); placeSignoff(); soon(); });
  $("sections-toggle").addEventListener("click", () => { if ($("layout").classList.contains("sections-open")) closeSections(true); else openSections(); });
  $("sections-close").addEventListener("click", () => closeSections(true));
  $("contents").addEventListener("click", (e) => { if (e.target.closest("[data-nav]")) closeSections(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeSections(true); });
  $("view-select").addEventListener("change", () => show($("view-select").value));
  if ("ResizeObserver" in window) new ResizeObserver(fitDock).observe($("dock"));
  fitDock();
}

// ---- Start -----------------------------------------------------------------------------------------------------
$("release-line").textContent = `${DATA.release}, catalogue ${DATA.catalogue_version}.`;
$("guide-link").setAttribute("href", DATA.guide);      // the guide lies beside the built form, not beside this template
for (const [name, title] of VIEWS) {
  const tab = clone("tpl-tab");
  tab.dataset.view = name;
  tab.textContent = title;
  tab.addEventListener("click", () => show(name));
  $("tabs").append(tab);
  $("view-select").append(new Option(title, name));
}
startFrame();
const restored = loadDraft();
const gainedInDraft = restored === "ok" ? FORMS.flatMap(readAliases) : [];
show(view);
if (restored === "ok") say("Your unsaved draft was restored from this browser." + aliasLine(gainedInDraft));
if (restored === "bad") say("The browser draft could not be read and was not restored.", "problem");
</script>
</body>
</html>

# The filled examples. Each one is a measure the ontology already holds, filled in as if it were new.
# The build command reads every answer it can from the ontology, word for word, and takes the rest from here.
# After you change this file, rebuild: py -m kpi_store.intake build
#
# `illustration` holds the answers the ontology does not hold. They are made up to show what an answer looks like.
# The signer names are placeholders, because no file of this release names a person.

[[example]]
measure = "crack-spreads"
file = "crack-spreads-pricing"
comment = "A shipped example. Every answer is quoted from the ontology, except these illustrations, which the ontology does not hold: 1.4, 2.5, 3.2, 3.7 to 3.11, 4.9, 6.8 and 6.9. The domain in 1.5 comes from the example domain list in settings.toml. A source that settings.toml hides is left out of 3.5. The signer names are placeholders."

  [example.request]
  number = "EXAMPLE-1"
  date = "2026-11-11"
  requester_role = "Program manager"
  invited = "Global Process Owner, Data Owner, Data Steward, Data Product Owner"

  [example.illustration]
  "1.5" = "market-price"
  "1.4" = "Illustration: Planners read the crack spread to judge the market margin before they set the refinery plan."
  "2.5" = "Illustration: Capture the market margin: plan refinery runs and product placement against the benchmark crack spreads."
  "3.2" = "Illustration: US dollars per barrel"
  "3.7" = "anyone"
  "3.8" = "Illustration: One value for each day and each Price Master record. It rolls up by price group, price sheet and price batch."
  "3.9" = "draft"
  "3.10" = "Illustration: Active records only. Soft-deleted rows are excluded. If the check fails, the day's values are held back."
  "3.11" = "Illustration: Once a year. It stops being used when the benchmark it is built from is no longer published."
  "4.9" = "Illustration: Market margin potential"
  "6.8" = "Illustration: Economics and Planning Manager, Commercial"
  "6.9" = "Illustration: Pricing Representative, Commercial"

  [example.sign_offs]
  data-owner = { name = "Placeholder for the Data Owner's name", date = "2026-11-11" }
  domain-confirmation = { name = "Placeholder for the Domain Owner's name", date = "2026-11-11" }
  architect = { name = "Placeholder for the Architect's name", date = "2026-11-11" }

[[example]]
measure = "rm-margin-per-barrel"
file = "rm-margin-per-barrel"
comment = "A shipped example. Every answer is quoted from the ontology, except these illustrations, which the ontology does not hold: 1.4, 2.5, 3.2, 3.7 to 3.13, 4.9, 6.1, 6.8 and 6.9. The domain in 1.5 comes from the example domain list in settings.toml. settings.toml hides both sources the ontology gives this measure, so 3.5 names the MPC Form 10-K, which the measure's citation in the ontology cites as MPC-S01 p. 51. The ontology names no role, no data product and no view for this measure. The signer names are placeholders."

  [example.request]
  number = "EXAMPLE-2"
  date = "2026-11-11"
  requester_role = "Program manager"
  invited = "Global Process Owner, Data Owner, Data Steward, Data Product Owner"

  [example.illustration]
  "1.5" = "financial-performance"
  "3.5" = ["https://w3id.org/mpc/ontology/source/mpc-s01"]
  "1.4" = "Illustration: Sales planners compare the realized margin per barrel with the forecast to explain the gap."
  "2.5" = "Illustration: Grow the refining and marketing margin on every barrel sold."
  "3.2" = "Illustration: US dollars per barrel"
  "3.7" = "anyone"
  "3.8" = "Illustration: One value for each month and each refining region."
  "3.9" = "draft"
  "3.10" = "Illustration: Closed accounting periods only. A month that is still open is excluded. If the check fails, the month is not reported."
  "3.11" = "Illustration: Each year, with the plan. It stops being used when the segment's margin is no longer reported per barrel."
  "3.12" = ["Illustration: Realized margin per barrel below the month's forecast, in US dollars per barrel: review it with Business Planning and Analysis."]
  "3.13" = "Illustration: Starts 2026-01-01. No end date."
  "4.9" = "Illustration: Pricing"
  "6.8" = "Illustration: Value Chain Optimization Director, Commercial"
  "6.9" = "Illustration: Business Planning and Analysis, Finance"
  "6.1" = ["https://w3id.org/mpc/ontology/modules/kpi/persona/mid-term-planner"]

  [example.sign_offs]
  data-owner = { name = "Placeholder for the Data Owner's name", date = "2026-11-11" }
  domain-confirmation = { name = "Placeholder for the Domain Owner's name", date = "2026-11-11" }
  architect = { name = "Placeholder for the Architect's name", date = "2026-11-11" }

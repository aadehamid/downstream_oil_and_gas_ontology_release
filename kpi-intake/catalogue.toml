# The KPI intake catalogue. Every question of the KPI intake form is in this file, with its section, the role
# that answers it, the kind of answer, the rule that says when it is asked, and the reason it is asked.
#
# The two forms (kpi-intake-form.html and kpi-intake-form.xlsx), the explainer, the Architect's page and the
# completeness check are all built from this file. After you change it, rebuild them:
#
#     python -m kpi_store.intake build
#
# What you can change here without touching code: any text, the rules, the routing outcomes, the sign-off block
# and the time estimates. The role titles and the lists your organization sets for itself are in settings.toml. A new question
# needs an id that no other question has. A question may carry `help`, one line the forms show under its answer. README.md in this folder explains each field under "Change the form".

version = "1.2"
release = "KPI Store 1.2"

# ---- The fixed choices -----------------------------------------------------------------------------------------
# Short lists that are the same in every organization. A list that an organization sets for itself, such as the
# answers to "who may see it", is in settings.toml beside this file, and a question names it as
# source = "settings:<list>". A list the ontology holds is named by its plain name, such as source = "measures".

[[choices.yes-no]]
id = "yes"
label = "Yes"

[[choices.yes-no]]
id = "no"
label = "No"

[[choices.yes-no-not-sure]]
id = "yes"
label = "Yes"

[[choices.yes-no-not-sure]]
id = "no"
label = "No"

[[choices.yes-no-not-sure]]
id = "not-sure"
label = "Not sure"

# The kinds of item the reference-item form names (KPI-DEC-0002, Q10 form 5). The form adds the first two; each of
# the others routes to "needs a specialist", with the reason in its route's notice.
[[choices.reference-item-kinds]]
id = "system"
label = "A system that a document names: an application, an office tool or a working document"

[[choices.reference-item-kinds]]
id = "table"
label = "A table in Databricks that copies a table of a system (a replica)"

[[choices.reference-item-kinds]]
id = "built-table"
label = "A table or a view that Databricks builds from other tables"

[[choices.reference-item-kinds]]
id = "source"
label = "A source document"

[[choices.reference-item-kinds]]
id = "role"
label = "A role"

[[choices.reference-item-kinds]]
id = "data-product"
label = "A data product of the data-product catalog"

# The patterns of the new-module form (KPI-DEC-0002, Q10 form 6 and Q11). The form makes the first two. The third is new
# modelling: an AI drafts it under the five gates of Q19 (Q17(a)), or a specialist designs it.
[[choices.module-patterns]]
id = "vocabulary"
label = "A vocabulary: terms with a definition, other names and a place in a hierarchy"

[[choices.module-patterns]]
id = "reference-table"
label = "A reference table: items of a class the ontology holds, each with values of properties the ontology holds"

[[choices.module-patterns]]
id = "new-modelling"
label = "Something else: a new class, a new property or a rule of its own"

[[choices.environment]]
id = "sandbox"
label = "Sandbox"

[[choices.environment]]
id = "production"
label = "Production"

# ---- The routing outcomes --------------------------------------------------------------------------------------
# A route on a question names one of these outcomes. "blocks" says whether the intake can be complete while the
# outcome stands. "consult" names the entry of the sign-off block that must then record a date and an outcome.

[outcome.domain-activation]
title = "Domain activation needed"
blocks = true
next = "Fill in the domain activation form. The KPI form can be completed after the domain is active in settings.toml, or proposed in one run with the signed domain activation."

[outcome.process-map-request]
title = "Process map request needed"
blocks = true
next = "Fill in the process map request for the Global Process Owner and the Architect. The KPI form can be completed after the Architect has added what is missing, or, for a business area, a process or a step, proposed in one run with the signed process map request. This is not a domain activation."

[outcome.restricted-review]
title = "Restricted: bring in Privacy, Security, Compliance and Risk"
blocks = false
consult = "privacy-security-compliance-risk"
next = "Record the date and the outcome of their review in the sign-off block before the signatures."

[outcome.needs-specialist]
title = "Needs a specialist"
blocks = true
next = "This form cannot add this kind of item. The Architect takes the request to a specialist, who changes the ontology with HOW-TO-UPDATE.md."

[outcome.new-modelling]
title = "New modelling: an AI draft or a specialist"
blocks = false
next = "Before anyone signs, the Architect asks the AI to draft the module: python -m kpi_store.propose --ai-draft <this file> (HOW-TO-UPDATE.md, \"Draft new modelling with AI (optional)\"). The signers then read the draft's summary and sign. The propose command refuses the form unless the draft passed all five gates. Without AI, a specialist designs the module."

[outcome.note]
title = "For the Architect"
blocks = false
next = ""

# ---- The request and the sign-off ------------------------------------------------------------------------------

[[request_field]]
id = "number"
label = "Request number"

[[request_field]]
id = "date"
label = "Date of the request"

[[request_field]]
id = "requester_role"
label = "The requester's role"

[[request_field]]
id = "invited"
label = "The people invited"

[sign_off]
intro = "The check refuses a form that lacks a signature it requires. The form records each signer's role, name and date. The ontology records roles and never a person's name, so the name stays in the form's file."

[[sign_off.signer]]
id = "data-owner"
role = "data-owner"
meaning = "The KPI's definition in this form is right: its name, its meaning, what it counts and what it leaves out."
change_meaning = "The measure's name, definition, other names and process links are right as this form changes them."
item_meaning = "The new item is right as this form describes it: its name, what it is and what it links to."
module_meaning = "The new module's content is right as this form describes it: each term or item, its name and its values."
required = "Every KPI, every term change, every reference item and every new module"
forms = ["kpi-intake", "term-change", "reference-item", "new-module"]
when = "always"

[[sign_off.signer]]
id = "domain-confirmation"
role = "domain-owner"
meaning = "This KPI belongs to my domain."
required = "Every KPI"
forms = ["kpi-intake"]
when = "always"

[[sign_off.signer]]
id = "domain-owner"
role = "domain-owner"
meaning = "I have decided between the two definitions, and this one stands."
activation_meaning = "The domain is described rightly in this form, and I am its owner."
required = "Only when the check finds a definition that conflicts with this one. Always on a domain activation form"
forms = ["kpi-intake", "domain-activation"]
when = "conflict"

[[sign_off.signer]]
id = "global-process-owner"
role = "global-process-owner"
meaning = "The processes, steps and roles in this request are right."
required = "Every process map request"
forms = ["process-map-request"]
when = "always"

# A signer with when = "answer" signs only when the question `answer_of` has one of `answers`.
[[sign_off.signer]]
id = "ontology-owner"
role = "ontology-owner"
meaning = "This change alters what the measure means, and I approve it as a major change."
module_meaning = "The ontology needs this module, no module owns its area already, and I approve its first release, 1.0.0, as a major change."
required = "On a term change, only when the change is major: the answer to T8 is \"no\" or \"not sure\". Always on a new module form"
forms = ["term-change", "new-module"]
always_on = ["new-module"]
when = "answer"
answer_of = "T8"
answers = ["no", "not-sure"]

[[sign_off.signer]]
id = "architect"
role = "architect"
meaning = "The form is complete, and I approve the change to the ontology."
required = "Every form, last"
forms = ["kpi-intake", "domain-activation", "process-map-request", "term-change", "reference-item", "new-module"]
when = "always"

[[sign_off.consulted]]
id = "enterprise-data-governance"
who = "Enterprise Data Governance"
when_text = "The check finds the same name in another module of the ontology"
when = "same-name"

[[sign_off.consulted]]
id = "privacy-security-compliance-risk"
who = "Privacy, Security, Compliance and Risk"
when_text = "The answer to 3.7 is \"restricted\""
when = "restricted"

# ---- The sections ----------------------------------------------------------------------------------------------

[[section]]
id = "1"
form = "kpi-intake"
name = "The business area"
technical_name = "domain identification"
audience = "business"
about = "Here we find the business area and the domain of the KPI, and the process and step where people use it. The business area is the function that runs the process, such as Commercial or Marketing. The domain is the data domain the KPI belongs to, such as Market Price, and it has a Domain Owner. We do this first because the ontology hangs every KPI on a process it already knows, and because every KPI belongs to one domain. If the process or the step is missing, the request goes to the process map first. If the domain is not active, it is activated first."
who = "The Global Process Owner, or a named delegate, picks the area, the process and the step. The Program manager proposes the domain, and that domain's Domain Owner confirms that the KPI is in its scope. The Domain Owner need not sit in the rest of the interview. The Business analyst shows the lists and records the answers."
done_when = "The form names one business area, one process, one step and one active domain from the lists, or the request has moved to a process map request or to domain activation."
typical = "5 to 6"
minutes = "8"

[[section]]
id = "2"
form = "kpi-intake"
name = "What the KPI means"
technical_name = "the controlled vocabulary"
audience = "business"
about = "Here we agree on one name and one meaning for the KPI. Every later fact is attached to this meaning. If two teams mean different things by the same name, the KPI would count the wrong thing, and people would have to correct every report that used it."
who = "The Data Owner gives the definition and later signs it. The Business analyst drafts the wording."
done_when = "The KPI has one name, a definition of one or two sentences that does not repeat the name, a statement of what it counts and what it leaves out, and the business objective it helps to track. The completeness check has compared the name with the terms the ontology already holds."
typical = "5"
minutes = "13"

[[section]]
id = "3"
form = "kpi-intake"
name = "The facts about it"
technical_name = "the metadata"
audience = "business"
about = "Here we record a fixed set of facts about the KPI: how it is worked out, its unit, how often and at what level it is stated, what it is compared with, and where its definition is written. We also record its status, what makes it trustworthy, when it is reviewed, and any thresholds. With these facts, a reader can check a definition, tell which document it came from, and know whether to rely on the number yet."
who = "The Data Steward answers."
done_when = "The form says in words how the KPI is worked out, with its unit and its grain, names a written source with a date, and gives the KPI's status. A KPI with no written source cannot go forward."
typical = "12 to 13"
minutes = "17"

[[section]]
id = "4"
form = "kpi-intake"
name = "Where it belongs"
technical_name = "the taxonomy (the measure list is flat, so the taxonomy is the measure's kind)"
audience = "business"
about = "Here we sort the KPI into one of eight kinds of measure. The kind tells readers how to treat the number. A market price nobody controls, a comparison with a plan and a KPI with a target and an owner are read in different ways. We ask up to five yes or no questions in order and stop at the first one that decides."
who = "The Data Owner answers. The Business analyst asks the questions in order and writes the reason."
done_when = "One question has decided the kind, and the reason is written in one or two sentences. If the kind is KPI, the form names the document that records the target and the accountable owner."
typical = "4 to 6"
minutes = "6"

[[section]]
id = "5"
form = "kpi-intake"
name = "Other names for it"
technical_name = "the thesaurus (question 5.2 feeds a typed property, because the ontology has no skos:related link)"
audience = "business"
about = "Here we collect the other words people use for the KPI, and the nearby measures people mistake it for. With the other names, a person who searches with their own word finds the KPI. With the \"not this\" list, an AI assistant or a report does not answer with the wrong number."
who = "The Data Steward answers."
done_when = "The form lists every other name the attendees know, and gives one sentence of difference for each measure the KPI is mistaken for."
typical = "4"
minutes = "6"

[[section]]
id = "6"
form = "kpi-intake"
name = "What it connects to"
technical_name = "the ontology (the typed links to roles, processes, value stream steps and data products)"
audience = "business"
about = "Here we link the KPI to the roles that use it, to its named owner and steward, to the other places in the business where it is used, and to the data product that gives it. These links let a person ask \"who uses this number, who answers for it, and where does it come from\" and get one answer."
who = "The Data Owner answers. The Data Product Owner names the data product in 6.6."
done_when = "The form names at least one role that uses the KPI, and its owner and its steward. Each value stream step it names has a relationship and a written basis. The form names the data product, or says that none exists yet."
typical = "6 to 8"
minutes = "14"

[[section]]
id = "7"
form = "kpi-intake"
name = "Where the data lives (IT only)"
technical_name = "the knowledge graph"
audience = "it"
about = "Here Digital IT names the view or table that gives the KPI's values, and what that view is built from. The business does not take part. IT fills this section after the business has signed sections 1 to 6. The Databricks discovery fills in what it can find first."
who = "Digital IT answers. The Data Product Owner confirms 7.1 if the view is new. The Architect checks that every name exists in the workspace."
done_when = "The form names one view or table that exists in the workspace under that exact name, or says that the KPI has no data yet. The first is not required. A KPI can be defined before anyone builds it."
warning = "The load compares the ontology with the workspace. An object, a column or a table link that the ontology names and the workspace lacks stops the load. Name only what exists."
typical = "4 to 10"
minutes = "20 to 30"

[[section]]
id = "D"
form = "domain-activation"
name = "Domain activation"
technical_name = "a data domain that is not active yet"
audience = "business"
about = "Use this form when the answer to question 1.5 of the KPI form is a domain that is not active, or \"not in the list\". A domain is a data domain, such as Customer or Market Price: a body of data with one Domain Owner. The form collects what the organization needs to make the domain active: what data it covers, who owns it, and what it serves. When the Domain Owner and the Architect have signed, the Architect turns the form into a proposal with one command and applies the proposal with another, which sets the domain to active in settings.toml. The KPI form can then go on. Nobody edits a file by hand."
who = "The Domain Owner answers and signs. The Program manager owns the request. The Business analyst fills the form."
done_when = "The domain has a name, a statement of the data it covers, a Domain Owner, its Data Owners and Data Stewards, the business areas it serves, at least one first KPI and a written basis with a date. The Domain Owner has signed the activation, and the Architect has signed the change."
typical = "10"
minutes = "60"

[[section]]
id = "P"
form = "process-map-request"
name = "Process map request"
technical_name = "a business area, process, step or role that the process map lacks"
audience = "business"
about = "Use this form when a question of the KPI form ends in \"not in the list\" for the business area, the process, the step or a role. It is smaller than a domain activation and it is not one. It collects what the Architect needs to change the process map. When the Global Process Owner and the Architect have signed, the Architect turns the form into a proposal with one command and applies the proposal with another. The two commands add new business areas, processes and steps, which the apply command releases in a new version of core, and new roles and their RACI entries. A request adds one level of the map: a step of a new process goes in with a request of its own, once the process is in the map."
who = "The Global Process Owner, or a named delegate, answers and signs. The Program manager owns the request. The Business analyst fills the form."
done_when = "The form names what is missing, where it sits in the process map, and a document that describes it. The Global Process Owner and the Architect have signed."
typical = "4 to 7"
minutes = "30"

[[section]]
id = "T"
form = "term-change"
name = "Term change"
technical_name = "a change to a measure the ontology already holds"
audience = "business"
about = "Use this form to change a measure the ontology already holds: its name, its definition, its other names, or the processes it is linked to. A new KPI goes through the KPI form instead. When the form is complete and signed, the Architect turns it into a proposal with one command and applies the proposal with another. Nobody edits a file of the ontology by hand."
who = "The Data Owner answers and signs. The Architect checks the form and signs last. When the answer to T8 is \"no\" or \"not sure\", the Ontology Owner signs too. The Business analyst fills the form."
done_when = "The form names one measure and asks for at least one change. T8 is answered. The Data Owner and the Architect have signed, and the Ontology Owner too when the change is major."
typical = "3 to 8"
minutes = "15"

[[section]]
id = "R"
form = "reference-item"
name = "Reference item"
technical_name = "a new system or a new table in a module that the ontology already holds"
audience = "business"
about = "Use this form to add a reference item to the ontology: a system that a document names, or a table in Databricks that copies a table of a system. The form asks only what the ontology needs: the item's name, what it is, and what it links to, picked from the ontology's own lists. A new source document, a role, a data product and a table built from other tables need a specialist, and the form says why. When the form is complete and signed, the Architect turns it into a proposal with one command and applies the proposal with another. Nobody edits a file of the ontology by hand."
who = "The Data Owner answers and signs. Digital IT names a table's system and its record. The Architect checks the form and signs last. The Business analyst fills the form."
done_when = "The form names one new item of a kind the form adds, with every answer its kind needs. The Data Owner and the Architect have signed."
typical = "4 to 7"
minutes = "10"

[[section]]
id = "N"
form = "new-module"
name = "New module"
technical_name = "a new module: a vocabulary, a reference table, or new modelling that an AI drafts"
audience = "business"
about = "Use this form when a data area brings terms or items that no module of the ontology holds. The form makes a module of one of two patterns. A vocabulary is a list of terms, each with a definition, other names and at most one broader term. A reference table is a list of items of a class the ontology holds already, such as brands, each with one value of each of a few properties the ontology holds already. A new class, a new property or a rule of its own is new modelling: before anyone signs, an AI drafts it from N13 under five extra gates, and the signers read its plain-words summary; without AI, a specialist designs it. When the Data Owner, the Ontology Owner and the Architect have signed, the Architect turns the form into a proposal with one command and applies the proposal with another. The apply writes the module's folder, registers the module in every place the release lists its modules and releases it at 1.0.0. Nobody edits a file of the ontology by hand."
who = "The Data Owner answers and signs. The Ontology Owner approves the new module, because a module's first release is a major. The Architect checks the form and signs last. The Business analyst fills the form."
done_when = "The form names the module, says what it covers and which documents describe it, picks a pattern, and gives every term or item what its pattern needs, or for new modelling says in N13 what the module must let people say. The Data Owner, the Ontology Owner and the Architect have signed."
typical = "8 to 10"
minutes = "30"

# ---- The kind of measure ---------------------------------------------------------------------------------------
# Section 4 asks up to five tests in order. The first answer below that matches decides the kind.

[[kind_rule]]
question = "4.1"
answer = "no"
kind = "tracker or report"
test = 1
note = "A list, a status or a schedule is recorded as a tracker or a report. A request for a tool is not a measure. The Architect decides which of the two it is."

[[kind_rule]]
question = "4.2"
answer = "yes"
kind = "alert"
test = 2

[[kind_rule]]
question = "4.3"
answer = "yes"
kind = "market indicator"
test = 3

[[kind_rule]]
question = "4.4"
answer = "yes"
kind = "decision-support indicator"
test = 3

[[kind_rule]]
question = "4.5"
answer = "yes"
kind = "plan-variance diagnostic"
test = 4

[[kind_rule]]
question = "4.6"
answer = "yes"
kind = "KPI"
test = 5

[[kind_rule]]
question = "4.6"
answer = "no"
kind = "operational metric"
test = 5

# ---- Section 1 -------------------------------------------------------------------------------------------------

[[question]]
id = "1.1"
section = "1"
text = "Which part of the business does this KPI belong to?"
asked_of = ["global-process-owner"]
type = "choice"
source = "business-areas"
required = "required"
why = "The area decides which processes and roles the next questions offer."
feeds = "No property on the measure. The check compares it with `core:businessDomain` of the process chosen in 1.3."
fact = []

  [[question.option]]
  id = "@not-in-list"
  label = "Not in the list"

  [[question.route]]
  when = "@not-in-list"
  outcome = "process-map-request"
  notice = "The ontology does not hold this business area. The KPI cannot be added until the area is in the process map. Stop here and fill in the process map request."

  [question.detail]
  label = "What is the missing area called?"
  type = "text"
  required_when = "@not-in-list"

[[question]]
id = "1.2"
section = "1"
text = "Which process in that area is this KPI about?"
asked_of = ["global-process-owner"]
type = "choice"
source = "processes"
levels = [1, 3]
narrow_by = "1.1"
required = "required"
why = "A KPI says something about work. We need the work it describes."
feeds = "Narrows 1.3. Becomes `kpi:informsProcess` when 1.3 has no answer."
fact = ["F12"]

  [[question.option]]
  id = "@not-in-list"
  label = "Not in the list"

  [[question.route]]
  when = "@not-in-list"
  outcome = "process-map-request"
  notice = "The ontology does not hold this process. The KPI cannot be added until the process is in the process map. Stop here and fill in the process map request."

  [question.detail]
  label = "What is the missing process called?"
  type = "text"
  required_when = "@not-in-list"

[[question]]
id = "1.3"
section = "1"
text = "At which step of that process do people use the number?"
asked_of = ["global-process-owner"]
type = "choice"
source = "processes"
levels = [4, 6]
under = "1.2"
required = "optional"
why = "The step is the most exact place we can attach the KPI to."
feeds = "`kpi:informsProcess`."
fact = ["F12"]

  [[question.option]]
  id = "@not-in-list"
  label = "The step is missing"

  [[question.route]]
  when = "@not-in-list"
  outcome = "process-map-request"
  notice = "The ontology does not hold this step. Fill in the process map request for the missing step."

  [question.detail]
  label = "What is the missing step called?"
  type = "text"
  required_when = "@not-in-list"

[[question]]
id = "1.4"
section = "1"
text = "What do people decide or do with the number at that step?"
asked_of = ["global-process-owner"]
type = "long_text"
required = "required"
why = "It checks that we chose the right step, and it shows whether this is a KPI or a report."
feeds = "A check on the step. The answer stays in the form's file. The ontology has no property for it."
fact = []

[[question]]
id = "1.5"
section = "1"
text = "Which domain does this KPI belong to?"
note = "The domain list that ships with this release is an example. Replace it with your organization's domains in settings.toml."
asked_of = ["domain-owner"]
asked_of_text = "The Domain Owner of the proposed domain. The Program manager proposes which domain to ask"
type = "choice"
source = "settings:domains"
required = "required"
why = "Every KPI belongs to exactly one domain, and that domain's owner must agree that it does."
feeds = "No property yet. The ontology has no place for a KPI's domain. The answer stays in the form's file."
fact = []

  [[question.option]]
  id = "@not-in-list"
  label = "Not in the list"

  [[question.route]]
  when = "@inactive"
  outcome = "domain-activation"
  notice = "This domain is not active yet. The KPI cannot be added until the domain is activated."

  [[question.route]]
  when = "@not-in-list"
  outcome = "domain-activation"
  notice = "The organization has no such domain yet. The KPI cannot be added until the domain is activated."

  [question.detail]
  label = "What is the missing domain called?"
  type = "text"
  required_when = "@not-in-list"

[[question]]
id = "1.6"
section = "1"
text = "Which other domains' data does it use?"
asked_of = ["data-owner"]
type = "multi_choice"
source = "settings:domains"
rows = 4
required = "optional"
why = "A KPI often reads data that another domain owns, and that domain's people must know."
example = "The filled examples name no other domain. An answer would be \"Refinery Production\"."
feeds = "No property yet. The answer stays in the form's file."
fact = []

# ---- Section 2 -------------------------------------------------------------------------------------------------

[[question]]
id = "2.1"
section = "2"
text = "What do you call this KPI?"
asked_of = ["data-owner"]
type = "text"
required = "required"
why = "One preferred name stops two teams from using two names for one thing."
feeds = "`skos:prefLabel`. The Architect derives `skos:notation` from it."
fact = ["F1", "F3"]

[[question]]
id = "2.2"
section = "2"
text = "In one or two sentences, what does it measure? Please do not use the KPI's own name."
asked_of = ["data-owner"]
type = "long_text"
required = "required"
why = "The definition is what every report and every answer will repeat."
feeds = "`skos:definition`."
fact = ["F2"]

[[question]]
id = "2.3"
section = "2"
text = "What does it count?"
asked_of = ["data-owner"]
type = "long_text"
required = "optional"
why = "Two people can agree on a name and still count different things."
feeds = "`pop:includes`."
fact = ["F21"]

[[question]]
id = "2.4"
section = "2"
text = "What does it leave out?"
asked_of = ["data-owner"]
type = "long_text"
required = "optional"
why = "What is left out is where most disputes about a number start."
feeds = "`pop:excludes`."
fact = ["F21"]

[[question]]
id = "2.5"
section = "2"
text = "Which business objective does this KPI help you track? Write \"None stated\" if no objective has been agreed."
asked_of = ["data-owner"]
type = "long_text"
required = "required"

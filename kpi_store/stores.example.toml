# KPI Store local settings: the stores and tools on the machine that runs the loads.
# Copy this file to a folder OUTSIDE the release folder, fill it in, and name it with --stores <file> or in the
# environment variable KPI_STORE_LOCAL. It holds passwords, so it never goes into the release folder or the zip:
# every command refuses a file it finds there. Paths may use / on Windows. A path without a drive starts at this file's
# folder, so the paths below hold wherever you keep this file. A full path works too, and ~ stands for your user folder.

[release]
settings = "kpi_store.toml"                       # this environment's kpi_store.toml; the runner uploads a copy with the zip's checksum
run_folder = "runs"                               # the runner writes each run's files here

[databricks]
profile = "DEFAULT"                               # the Databricks CLI profile you signed in with (databricks auth login)
workspace_folder = "/Workspace/Shared/kpi_store"  # the notebook is imported here as kpi_store_load
timeout_minutes = 60                              # how long the runner waits for the notebook run
environment_version = "2"                         # the serverless environment of the notebook run: "2" has Python 3.11; "" leaves the choice to the workspace
cli = ""                                          # the databricks executable; empty means the one on PATH

[fuseki]
jar = "jena-fuseki-server-6.2.0.jar"
url = "http://127.0.0.1:3030/ds"                  # the dataset's URL; the load starts Fuseki here when nothing answers
data_folder = "fuseki-db"                         # the dataset is kept here across restarts; empty keeps it in memory
java = ""                                         # the java executable, for Fuseki and for ROBOT; empty means JAVA_HOME, then PATH

[neo4j.local]                                     # Neo4j Desktop, with the n10s and APOC plugins. The load EMPTIES this database;
                                                  # it stops, changing nothing, when the database is Enterprise's or holds nodes but no KPI Store marker.
uri = "bolt://127.0.0.1:7687"
username = "neo4j"
password = "<the local password>"                 # or leave out and set password_env = "<an environment variable's name>"
database = "neo4j"
plugins_folder = ""                               # the DBMS's plugins folder; when set, the two plugin jars are checked by checksum

[neo4j.enterprise]                                # the copy's target. The copy writes to this one database and to no other.
uri = "neo4j://<the Enterprise server>:7687"
username = "<your user name>"
password = "<the Enterprise password>"            # or leave out and set password_env
database = "businessprocessarchitecturegraph"

[projection]
robot_jar = "robot.jar"                           # ROBOT 1.9.10, which runs the reasoner before the Neo4j load
out = "lpg-out"                                   # the Neo4j load's working files and its report

[tools]
bash = ""                                         # bash.exe of Git for Windows; empty means the usual install folders, then PATH

[ai]                                              # AI suggestions for a form's answers, with propose --ai. Off until the client's IT approves a provider.
provider = "off"                                  # "off", "databricks" (a serving endpoint in your workspace), "anthropic", "openai" or "by-hand"
model = ""                                        # databricks: the serving endpoint's name; anthropic or openai: the model's name
profile = ""                                      # databricks: the Databricks configuration profile that gives the workspace and the token
key_env = ""                                      # anthropic or openai: the environment variable that holds the API key. Never write a key in this file
assistant = ""                                    # by-hand: the assistant you give the prompt to, such as "Genie Code"
approved_by = ""                                  # who approved the provider for the client's IT
approved_on = ""                                  # the date of that approval, such as "2026-11-20"
